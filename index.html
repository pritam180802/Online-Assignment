<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking PO English Mock — Mallika Naiya</title>

    <style>
        /* =========================================================
           1. RESET & SYSTEM DESIGN TOKENS (ZERO EXTERNAL DEPENDENCY)
           ========================================================= */
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-mid: #cbd5e1;

            --blue-950: #172554;
            --blue-900: #1e3a8a;
            --blue-700: #1d4ed8;
            --blue-600: #2563eb;
            --blue-100: #dbeafe;
            --blue-50: #eff6ff;

            --emerald-600: #059669;
            --emerald-500: #10b981;
            --emerald-100: #d1fae5;
            --emerald-50: #ecfdf5;

            --rose-600: #e11d48;
            --rose-500: #f43f5e;
            --rose-100: #ffe4e6;
            --rose-50: #fff1f2;

            --amber-600: #d97706;
            --amber-500: #f59e0b;
            --amber-400: #fbbf24;
            --amber-100: #fef3c7;
            --amber-50: #fffbeb;

            --purple-600: #9333ea;
            --purple-100: #f3e8ff;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }

        /* =========================================================
           2. TOP HEADER & COUNTDOWN TIMER
           ========================================================= */
        .top-header {
            background-color: var(--blue-950);
            color: #ffffff;
            padding: 0.875rem 1rem;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
            position: sticky;
            top: 0;
            z-index: 40;
            border-bottom: 1px solid var(--blue-900);
        }

        @media (min-width: 768px) {
            .top-header {
                padding: 0.875rem 2rem;
            }
        }

        .header-inner {
            max-width: 56rem;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .brand-icon {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber-400);
            transition: background-color 0.2s ease;
        }

        .brand-box:hover .brand-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            line-height: 1.25;
        }

        @media (min-width: 768px) {
            .brand-title {
                font-size: 1.125rem;
            }
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: #bfdbfe;
            font-weight: 500;
        }

        .brand-subtitle strong {
            color: #ffffff;
            font-weight: 700;
        }

        .timer-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--blue-900);
            border: 1px solid var(--blue-700);
            padding: 0.5rem 0.875rem;
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .timer-pill svg {
            color: var(--amber-400);
        }

        .timer-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        @media (min-width: 768px) {
            .timer-text {
                font-size: 1.125rem;
            }
        }

        .timer-danger {
            background-color: #dc2626 !important;
            border-color: #fca5a5 !important;
            animation: pulseWarning 1s infinite;
        }

        @keyframes pulseWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.78; }
        }

        /* =========================================================
           3. MAIN CONTAINER & CARDS
           ========================================================= */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 56rem;
            margin: 0 auto;
            padding: 1rem 1rem 7.5rem 1rem;
        }

        @media (min-width: 768px) {
            .main-container {
                padding: 2rem 2rem 8rem 2rem;
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 1.25rem;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        .header-card {
            padding: 1.125rem 1.25rem;
            margin-bottom: 1.5rem;
        }

        .header-card-top {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .quiz-title {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.2rem 0.65rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .badge-blue {
            background-color: var(--blue-50);
            color: var(--blue-700);
            border: 1px solid var(--blue-100);
        }

        .badge-amber {
            background-color: var(--amber-100);
            color: #92400e;
        }

        .badge-rose {
            background-color: var(--rose-100);
            color: #be123c;
        }

        .q-counter {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Progress Bar */
        .progress-track {
            height: 0.4rem;
            width: 100%;
            background-color: #f1f5f9;
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--blue-600);
            transition: width 0.3s ease;
        }

        /* Question Jump Palette */
        .palette-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .palette-btn {
            width: 2.15rem;
            height: 2.15rem;
            border-radius: 0.55rem;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid var(--border-light);
            background-color: #f8fafc;
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .palette-btn:hover {
            background-color: #e2e8f0;
        }

        .palette-answered {
            background-color: var(--blue-100);
            color: #1e40af;
            border-color: #93c5fd;
            font-weight: 700;
        }

        .palette-correct {
            background-color: var(--emerald-100);
            color: #065f46;
            border-color: #6ee7b7;
            font-weight: 700;
        }

        .palette-wrong {
            background-color: var(--rose-100);
            color: #9f1239;
            border-color: #fda4af;
            font-weight: 700;
        }

        .palette-current {
            outline: 2px solid var(--blue-600);
            outline-offset: 2px;
            font-weight: 800;
        }

        /* Question Card */
        .question-card {
            padding: 1.5rem;
            border-radius: 1.5rem;
            animation: fadeIn 0.25s ease-out forwards;
        }

        @media (min-width: 768px) {
            .question-card {
                padding: 2rem;
            }
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .question-text {
                font-size: 1.25rem;
            }
        }

        /* Option Buttons */
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 1rem 1.125rem;
            border-radius: 1rem;
            border: 2px solid var(--border-light);
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            transition: all 0.15s ease;
        }

        .option-btn:not(:disabled):hover {
            border-color: #93c5fd;
            background-color: rgba(239, 246, 255, 0.5);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }

        .option-badge {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-mid);
            background-color: #f1f5f9;
            color: var(--text-body);
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .option-label {
            font-size: 1rem;
            color: var(--text-body);
        }

        @media (min-width: 768px) {
            .option-label {
                font-size: 1.075rem;
            }
        }

        /* Option States */
        .option-selected {
            border-color: var(--blue-600);
            background-color: var(--blue-50);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.12);
        }
        .option-selected .option-badge {
            background-color: var(--blue-600);
            border-color: var(--blue-600);
            color: #ffffff;
        }
        .option-selected .option-label {
            color: var(--blue-950);
            font-weight: 700;
        }

        .option-correct {
            border-color: var(--emerald-500);
            background-color: var(--emerald-50);
        }
        .option-correct .option-badge {
            background-color: var(--emerald-600);
            border-color: var(--emerald-600);
            color: #ffffff;
        }
        .option-correct .option-label {
            color: #064e3b;
            font-weight: 700;
        }

        .option-wrong {
            border-color: #fb7185;
            background-color: var(--rose-50);
        }
        .option-wrong .option-badge {
            background-color: var(--rose-500);
            border-color: var(--rose-500);
            color: #ffffff;
        }
        .option-wrong .option-label {
            color: #881337;
            font-weight: 600;
        }

        .option-dimmed {
            opacity: 0.55;
            background-color: #f8fafc;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 1.5rem;
            background-color: var(--amber-50);
            border: 1px solid #fde68a;
            border-radius: 1rem;
            padding: 1.125rem 1.25rem;
            color: #451a03;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 800;
            color: #92400e;
            margin-bottom: 0.4rem;
        }

        /* =========================================================
           4. FIXED BOTTOM FOOTER NAVIGATION
           ========================================================= */
        .footer-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-light);
            padding: 0.875rem 1rem;
            z-index: 30;
            box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
        }

        .footer-inner {
            max-width: 56rem;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.85rem;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .btn-ghost {
            color: var(--text-body);
        }
        .btn-ghost:hover {
            background-color: #f1f5f9;
        }

        .btn-primary {
            background-color: var(--blue-600);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:hover {
            background-color: var(--blue-700);
        }

        .btn-success {
            background-color: var(--emerald-600);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.25);
        }
        .btn-success:hover {
            background-color: #047857;
        }

        .btn-dark {
            background-color: var(--text-main);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
        }
        .btn-dark:hover {
            background-color: #1e293b;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           5. RESULT SCORECARD & ANALYTICS DASHBOARD
           ========================================================= */
        .result-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.35s ease-out forwards;
        }

        .scorecard {
            border-radius: 1.75rem;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
        }

        .score-banner {
            padding: 2rem 1.5rem;
            color: #ffffff;
            text-align: center;
        }

        .banner-gold {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 55%, #d97706 100%);
        }

        .banner-blue {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 55%, #172554 100%);
        }

        .grade-icon-wrap {
            width: 4rem;
            height: 4rem;
            margin: 0 auto 0.75rem auto;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-kicker {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            opacity: 0.92;
            margin-bottom: 0.25rem;
        }

        .score-big {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .score-big span {
            font-size: 1.5rem;
            font-weight: 600;
            opacity: 0.78;
        }

        .score-sub {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            opacity: 0.88;
            margin-top: 0.5rem;
        }

        .grade-strip {
            padding: 1rem;
            text-align: center;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-light);
        }

        .grade-title {
            font-size: 1.35rem;
            font-weight: 800;
        }

        .text-amber { color: var(--amber-600); }
        .text-blue { color: var(--blue-600); }
        .text-slate { color: var(--text-body); }

        /* Pritam's Personal Note Card */
        .pritam-note-section {
            padding: 1.75rem 1.25rem;
            background: linear-gradient(180deg, #ffffff 0%, #fff1f2 100%);
            text-align: center;
            position: relative;
        }

        .pritam-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #fb7185, #ec4899, #6366f1);
        }

        .pritam-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            background-color: var(--rose-50);
            border: 1px solid var(--rose-100);
            color: var(--rose-600);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }

        .pritam-quote {
            max-width: 40rem;
            margin: 0 auto;
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 1.125rem;
            line-height: 1.65;
            color: var(--text-body);
        }

        @media (min-width: 768px) {
            .pritam-quote {
                font-size: 1.25rem;
            }
        }

        /* 4-Card Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.875rem;
        }

        @media (min-width: 768px) {
            .metrics-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
            }
        }

        .metric-card {
            padding: 1.25rem 1rem;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .metric-icon {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .icon-purple { background-color: var(--purple-100); color: var(--purple-600); }
        .icon-amber { background-color: var(--amber-100); color: var(--amber-600); }
        .icon-emerald { background-color: var(--emerald-100); color: var(--emerald-600); }

        .metric-val {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .metric-val small {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .metric-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 0.2rem;
        }

        /* Circular SVG Accuracy Gauge */
        .gauge-wrap {
            position: relative;
            width: 4rem;
            height: 4rem;
            margin-bottom: 0.4rem;
        }

        .circular-chart {
            display: block;
            width: 100%;
            height: 100%;
        }

        .circle-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 3.8;
        }

        .circle {
            fill: none;
            stroke: var(--blue-600);
            stroke-width: 2.8;
            stroke-linecap: round;
            animation: progressAnim 1.1s ease-out forwards;
        }

        @keyframes progressAnim {
            0% { stroke-dasharray: 0 100; }
        }

        .gauge-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-main);
        }

        /* Breakdown Card */
        .breakdown-card {
            padding: 1.5rem;
            border-radius: 1.5rem;
        }

        .breakdown-title {
            font-size: 1.075rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .breakdown-icon {
            background-color: var(--blue-100);
            color: var(--blue-600);
            padding: 0.45rem;
            border-radius: 0.65rem;
            display: flex;
        }

        .stacked-bar {
            display: flex;
            height: 0.9rem;
            border-radius: 9999px;
            overflow: hidden;
            background-color: #f1f5f9;
            margin-bottom: 1.25rem;
        }

        .bar-correct { background-color: var(--emerald-500); }
        .bar-wrong { background-color: var(--rose-500); }
        .bar-skipped { background-color: #cbd5e1; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            text-align: center;
        }

        .stat-box {
            padding: 0.875rem 0.5rem;
            border-radius: 1rem;
        }

        .stat-correct { background-color: var(--emerald-50); border: 1px solid var(--emerald-100); }
        .stat-wrong { background-color: var(--rose-50); border: 1px solid var(--rose-100); }
        .stat-skipped { background-color: #f8fafc; border: 1px solid var(--border-light); }

        .stat-num {
            display: block;
            font-size: 1.65rem;
            font-weight: 900;
        }

        .stat-correct .stat-num { color: var(--emerald-600); }
        .stat-wrong .stat-num { color: var(--rose-600); }
        .stat-skipped .stat-num { color: var(--text-muted); }

        .stat-lbl {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Action Buttons Grid */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.875rem;
        }

        @media (min-width: 768px) {
            .action-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .btn-outline-blue {
            width: 100%;
            background-color: #ffffff;
            color: var(--blue-700);
            border: 2px solid #bfdbfe;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 700;
        }

        .btn-outline-blue:hover {
            background-color: var(--blue-50);
        }

        .btn-solid-dark {
            width: 100%;
            background-color: var(--text-main);
            color: #ffffff;
            border: 2px solid var(--text-main);
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 700;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.16);
        }

        .btn-solid-dark:hover {
            background-color: #1e293b;
        }

        /* =========================================================
           6. ANIMATIONS & CELEBRATION PARTICLES
           ========================================================= */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(115vh) rotate(720deg); opacity: 0; }
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.85; }
            100% { transform: translateY(-120vh) translateX(24px) rotate(12deg); opacity: 0; }
        }

        .particle-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            pointer-events: none;
        }

        .confetti {
            animation-name: fall;
            animation-timing-function: linear;
        }

        .coin {
            animation-name: fall;
            animation-timing-function: ease-in;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #78350f;
            border: 2px solid #b45309;
            background: radial-gradient(circle at 30% 30%, #fcd34d, #f59e0b);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .balloon {
            animation-name: rise;
            animation-timing-function: ease-out;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-header">
        <div class="header-inner">
            <div class="brand-box" onclick="resetQuiz()" title="Click to restart exam">
                <div class="brand-icon" id="header-bank-icon"></div>
                <div>
                    <h1 class="brand-title">Banking PO English Mock</h1>
                    <p class="brand-subtitle">Candidate: <strong>Mallika Naiya</strong></p>
                </div>
            </div>

            <!-- Countdown Timer -->
            <div id="timer-box" class="timer-pill">
                <span id="header-clock-icon"></span>
                <span id="timer-text" class="timer-text">30:00</span>
            </div>
        </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="app-container" class="main-container"></main>

    <!-- Bottom Fixed Action Bar -->
    <footer id="footer-nav" class="footer-bar">
        <div class="footer-inner">
            <button id="btn-prev" onclick="prevQuestion()" class="btn btn-ghost">
                <span id="icon-prev"></span>
                <span>Previous</span>
            </button>

            <div>
                <button id="btn-next" onclick="nextQuestion()" class="btn btn-primary">
                    <span>Next Question</span>
                    <span id="icon-next"></span>
                </button>

                <button id="btn-submit" onclick="calculateScore(false)" class="btn btn-success hidden">
                    Submit Test
                </button>

                <button id="btn-back-result" onclick="showResult()" class="btn btn-dark hidden">
                    View Report
                </button>
            </div>
        </div>
    </footer>

    <!-- Celebration Particle Overlay -->
    <div id="animation-container" class="particle-overlay hidden"></div>

    <script>
        /* =========================================================
           1. INLINE SVG ICON LIBRARY (ZERO EXTERNAL ICON DEPENDENCY)
           ========================================================= */
        function getSvgIcon(name, size = 20, extraAttrs = '') {
            const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extraAttrs}`;
            const icons = {
                building: `<svg ${common}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>`,
                clock: `<svg ${common}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
                arrowLeft: `<svg ${common}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
                arrowRight: `<svg ${common}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`,
                checkCircle: `<svg ${common}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
                xCircle: `<svg ${common}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>`,
                lightbulb: `<svg ${common}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>`,
                crown: `<svg ${common}><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>`,
                zap: `<svg ${common}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
                bookOpen: `<svg ${common}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
                heart: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="#f43f5e" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`,
                edit: `<svg ${common}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
                barChart: `<svg ${common}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
                eye: `<svg ${common}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`,
                rotateCcw: `<svg ${common}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`
            };
            return icons[name] || '';
        }

        /* =========================================================
           2. QUIZ DATA: 10 ENGLISH GRAMMAR QUESTIONS (NOUNS & GENDER)
           ========================================================= */
        const quizData = {
            title: "English Grammar: Nouns & Gender",
            totalTimeSeconds: 30 * 60, // 30 Minutes
            marksPerQuestion: 2,
            questions: [
                {
                    id: 1,
                    setLabel: "Plural Rules",
                    text: "Which of the following is the correct plural form of a word ending in \"-z\" or \"-ch\" according to the plural formation rules?",
                    options: ["Quizs", "Quizzes", "Benchs", "Taxs"],
                    correct: 1,
                    explanation: "Words ending with -s, -ss, -sh, -ch, -x, and -z take -es to form plurals (e.g., quizzes, benches, taxes)."
                },
                {
                    id: 2,
                    setLabel: "Plural Rules",
                    text: "Which of the following words ending in \"-o\" forms its plural by adding only \"-s\" as an exception?",
                    options: ["Mango", "Potato", "Piano", "Hero"],
                    correct: 2,
                    explanation: "While words ending in -o generally take -es (mangoes, potatoes, heroes), exceptions like pianos, photos, logos, and videos take -s."
                },
                {
                    id: 3,
                    setLabel: "Plural Rules",
                    text: "Which noun changes its ending from \"-f\" or \"-fe\" to \"-ves\" in the plural form?",
                    options: ["Roof", "Chief", "Calf", "Proof"],
                    correct: 2,
                    explanation: "Words ending in -f/-fe like calf, wife, knife, and leaf change to -ves (calves), whereas roofs, chiefs, and proofs are exceptions that take -s."
                },
                {
                    id: 4,
                    setLabel: "Plural Rules",
                    text: "Select the correct plural noun to complete the sentence: \"The bank keeps all important documents inside metal _______.\"",
                    options: ["saves", "safes", "safe", "safes'"],
                    correct: 1,
                    explanation: "Safe is a noun whose plural form is safes, whereas saves is a verb."
                },
                {
                    id: 5,
                    setLabel: "Foreign Plurals",
                    text: "What is the correct plural form of the word \"Hypothesis\"?",
                    options: ["Hypothesises", "Hypothesi", "Hypotheses", "Hypothesa"],
                    correct: 2,
                    explanation: "Words ending with -sis change to -ses in the plural form (e.g., hypothesis → hypotheses, crisis → crises, analysis → analyses)."
                },
                {
                    id: 6,
                    setLabel: "Foreign Plurals",
                    text: "Which of the following is the correct plural form of \"Criterion\"?",
                    options: ["Criterions", "Criteria", "Criterias", "Criterii"],
                    correct: 1,
                    explanation: "Words ending with -um or -on change to -a to form plurals (e.g., criterion → criteria, phenomenon → phenomena, datum → data)."
                },
                {
                    id: 7,
                    setLabel: "Foreign Plurals",
                    text: "According to the plural rules for words ending in \"-us\", what is the plural form of \"Radius\"?",
                    options: ["Radiuses", "Radia", "Radii", "Radises"],
                    correct: 2,
                    explanation: "Words ending with -us change to -i to form plurals (e.g., radius → radii, focus → foci, syllabus → syllabi)."
                },
                {
                    id: 8,
                    setLabel: "Gender Rules",
                    text: "Which of the following words is categorized under Common Gender in the class notes?",
                    options: ["Nephew", "Niece", "Lawyer", "Infant"],
                    correct: 2,
                    explanation: "Lawyer (along with teacher, doctor, friend, and student) represents Common Gender, whereas infant is placed under Neuter Gender."
                },
                {
                    id: 9,
                    setLabel: "Gender Rules",
                    text: "Fill in the blank according to the gender preference rule: \"I met a friend after a long time. _______ was very excited for our trip.\"",
                    options: ["It", "He", "They", "Which"],
                    correct: 1,
                    explanation: "When the gender of a common gender noun (friend) is unclear, Masculine Gender (He) is given preference."
                },
                {
                    id: 10,
                    setLabel: "Gender Rules",
                    text: "Choose the correct singular pronoun to complete the sentence: \"An animal entered our premises last night. _______ destroyed the fencing.\"",
                    options: ["He", "She", "It", "Who"],
                    correct: 2,
                    explanation: "Kid, baby, animal, child, infant, insect, and plants are treated as Neuter Gender and take It in the singular form."
                }
            ]
        };

        /* =========================================================
           3. ROMANTIC + MOTIVATIONAL QUOTES FROM PRITAM
           ========================================================= */
        const motivationalQuotes = [
            "Every grammar rule you master today is writing the success story of our tomorrow, Mallika. Keep going, my future Bank Manager!",
            "Watching you stay focused on your Banking PO dream makes my heart swell with pride. No matter the score, you are already my greatest inspiration.",
            "Just like the perfect sentence needs the right words, my life feels complete watching you chase your dreams with such grace and grit. Proud of you always!",
            "One day soon, you'll be signing important documents inside your own Bank Manager cabin—and I'll be right there smiling, knowing how hard you earned it.",
            "Even if a question feels tricky today, remember that your determination is unstoppable. Take a breath, trust yourself, and remember Pritam is always cheering for you!",
            "Your hard work has a quiet magic to it, Mallika. Keep believing in your Banking PO journey the same way I believe in you—completely and endlessly.",
            "Every mock test brings us one step closer to celebrating your selection together. Keep shining bright, my love—you've got this!",
            "Success isn't built in a single day, it's built in every quiet hour you dedicate to your dreams. And through every single hour, my heart is right beside you.",
            "Whether you score high or learn something new today, nothing changes how proud I am of the woman you are becoming. Keep conquering, future PO!",
            "You have the sharpest mind and the warmest heart, Mallika. That Bank Manager chair doesn't stand a chance against your dedication!"
        ];

        /* =========================================================
           4. APPLICATION STATE & DOM REFERENCES
           ========================================================= */
        let currentState = {
            mode: 'quiz', // 'quiz' | 'result' | 'review'
            currentIndex: 0,
            answers: {},
            score: 0,
            timeLeft: quizData.totalTimeSeconds,
            timerId: null,
            timeTaken: 0,
            wasAutoSubmitted: false,
            currentMotivation: "",
            lastQuoteIndex: -1
        };

        const container = document.getElementById('app-container');
        const footer = document.getElementById('footer-nav');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const btnBackResult = document.getElementById('btn-back-result');
        const animBox = document.getElementById('animation-container');
        const timerText = document.getElementById('timer-text');
        const timerBox = document.getElementById('timer-box');

        /* =========================================================
           5. INITIALIZATION & TIMER CONTROL
           ========================================================= */
        function initStaticIcons() {
            document.getElementById('header-bank-icon').innerHTML = getSvgIcon('building', 22);
            document.getElementById('header-clock-icon').innerHTML = getSvgIcon('clock', 16);
            document.getElementById('icon-prev').innerHTML = getSvgIcon('arrowLeft', 16);
            document.getElementById('icon-next').innerHTML = getSvgIcon('arrowRight', 16);
        }

        function init() {
            initStaticIcons();
            startTimer();
            render();
        }

        function resetQuiz() {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
            }
            const prevQuoteIdx = currentState.lastQuoteIndex;
            currentState = {
                mode: 'quiz',
                currentIndex: 0,
                answers: {},
                score: 0,
                timeLeft: quizData.totalTimeSeconds,
                timerId: null,
                timeTaken: 0,
                wasAutoSubmitted: false,
                currentMotivation: "",
                lastQuoteIndex: prevQuoteIdx
            };
            stopRewardAnimation();
            startTimer();
            render();
        }

        function startTimer() {
            updateTimerDisplay();
            currentState.timerId = setInterval(() => {
                currentState.timeLeft--;
                currentState.timeTaken++;
                updateTimerDisplay();
                if (currentState.timeLeft <= 0) {
                    calculateScore(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const safeTime = Math.max(0, currentState.timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (safeTime <= 60 && currentState.mode === 'quiz') {
                timerBox.classList.add('timer-danger');
            } else {
                timerBox.classList.remove('timer-danger');
            }
        }

        /* =========================================================
           6. QUIZ NAVIGATION & SCORING LOGIC
           ========================================================= */
        function selectAnswer(qIndex, optIndex) {
            if (currentState.mode !== 'quiz') return;
            currentState.answers[qIndex] = optIndex;
            render();
        }

        function jumpToQuestion(index) {
            if (index >= 0 && index < quizData.questions.length) {
                currentState.currentIndex = index;
                render();
            }
        }

        function nextQuestion() {
            if (currentState.currentIndex < quizData.questions.length - 1) {
                currentState.currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentState.currentIndex > 0) {
                currentState.currentIndex--;
                render();
            }
        }

        function pickDifferentQuote() {
            let idx = Math.floor(Math.random() * motivationalQuotes.length);
            if (motivationalQuotes.length > 1 && idx === currentState.lastQuoteIndex) {
                idx = (idx + 1) % motivationalQuotes.length;
            }
            currentState.lastQuoteIndex = idx;
            return motivationalQuotes[idx];
        }

        function calculateScore(autoSubmit = false) {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
                currentState.timerId = null;
            }

            let totalScore = 0;
            quizData.questions.forEach((q, idx) => {
                if (currentState.answers[idx] === q.correct) {
                    totalScore += quizData.marksPerQuestion;
                }
            });

            currentState.score = totalScore;
            currentState.mode = 'result';
            currentState.wasAutoSubmitted = autoSubmit;
            currentState.currentMotivation = pickDifferentQuote();

            updateTimerDisplay();
            render();
        }

        function startReview() {
            currentState.mode = 'review';
            currentState.currentIndex = 0;
            render();
        }

        function showResult() {
            currentState.mode = 'result';
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        /* =========================================================
           7. VIEW RENDERING
           ========================================================= */
        function render() {
            container.innerHTML = '';
            stopRewardAnimation();

            if (currentState.mode === 'quiz' || currentState.mode === 'review') {
                footer.classList.remove('hidden');
                renderQuestionView();
            } else {
                footer.classList.add('hidden');
                renderResultView();
            }
        }

        function renderQuestionView() {
            const q = quizData.questions[currentState.currentIndex];
            const isReview = currentState.mode === 'review';
            const totalQ = quizData.questions.length;
            const progress = ((currentState.currentIndex + 1) / totalQ) * 100;
            const selectedAnswer = currentState.answers[currentState.currentIndex];

            // Build Question Jump Palette
            let paletteHtml = '';
            quizData.questions.forEach((item, idx) => {
                const isCurrent = idx === currentState.currentIndex;
                const ans = currentState.answers[idx];
                let cls = 'palette-btn';

                if (isReview) {
                    if (ans === item.correct) cls += ' palette-correct';
                    else if (ans !== undefined) cls += ' palette-wrong';
                } else if (ans !== undefined) {
                    cls += ' palette-answered';
                }

                if (isCurrent) cls += ' palette-current';

                paletteHtml += `<button onclick="jumpToQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
            });

            const headerHtml = `
                <div class="card header-card">
                    <div class="header-card-top">
                        <div class="quiz-meta">
                            <span class="quiz-title">${quizData.title}</span>
                            <span class="badge badge-blue">${q.setLabel}</span>
                            ${isReview ? '<span class="badge badge-amber">SOLUTIONS</span>' : ''}
                        </div>
                        <div class="q-counter">Question ${currentState.currentIndex + 1} of ${totalQ}</div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="palette-grid">${paletteHtml}</div>
                </div>
            `;

            // Build Option Buttons
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isSelected = selectedAnswer === idx;
                const isCorrect = q.correct === idx;
                let btnCls = 'option-btn';
                let statusIcon = '';

                if (isReview) {
                    if (isCorrect) {
                        btnCls += ' option-correct';
                        statusIcon = `<span style="color: var(--emerald-600); display:flex;">${getSvgIcon('checkCircle', 20)}</span>`;
                    } else if (isSelected && !isCorrect) {
                        btnCls += ' option-wrong';
                        statusIcon = `<span style="color: var(--rose-500); display:flex;">${getSvgIcon('xCircle', 20)}</span>`;
                    } else {
                        btnCls += ' option-dimmed';
                    }
                } else if (isSelected) {
                    btnCls += ' option-selected';
                }

                optionsHtml += `
                    <button onclick="selectAnswer(${currentState.currentIndex}, ${idx})" ${isReview ? 'disabled' : ''} class="${btnCls}">
                        <div class="option-left">
                            <span class="option-badge">${String.fromCharCode(65 + idx)}</span>
                            <span class="option-label">${opt}</span>
                        </div>
                        ${statusIcon}
                    </button>
                `;
            });

            // Explanation in Review Mode
            const explanationHtml = (isReview && q.explanation) ? `
                <div class="explanation-box">
                    <div class="explanation-header">
                        ${getSvgIcon('lightbulb', 17)}
                        <span>Grammar Rule &amp; Solution</span>
                    </div>
                    <p>${q.explanation}</p>
                </div>
            ` : '';

            container.innerHTML = `
                ${headerHtml}
                <div class="card question-card">
                    <h2 class="question-text">Q${currentState.currentIndex + 1}. ${q.text}</h2>
                    <div>${optionsHtml}</div>
                    ${explanationHtml}
                </div>
            `;

            // Update Footer Buttons
            btnPrev.disabled = currentState.currentIndex === 0;
            btnNext.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            btnBackResult.classList.add('hidden');

            if (currentState.currentIndex < totalQ - 1) {
                btnNext.classList.remove('hidden');
            } else if (isReview) {
                btnBackResult.classList.remove('hidden');
            } else {
                btnSubmit.classList.remove('hidden');
            }
        }

        function renderResultView() {
            const totalQuestions = quizData.questions.length;
            const maxMarks = totalQuestions * quizData.marksPerQuestion;
            const attemptedCount = Object.keys(currentState.answers).length;
            const correctCount = currentState.score / quizData.marksPerQuestion;
            const wrongCount = attemptedCount - correctCount;
            const skippedCount = totalQuestions - attemptedCount;
            const percentage = Math.round((currentState.score / maxMarks) * 100);
            const accuracy = attemptedCount > 0 ? Math.round((correctCount / attemptedCount) * 100) : 0;
            const speedPerQ = attemptedCount > 0 ? Math.round(currentState.timeTaken / attemptedCount) : 0;

            let grade, animationType;
            if (percentage >= 80) {
                grade = { title: "Future Bank Manager!", colorClass: "text-amber", iconName: "crown" };
                animationType = 'coins';
            } else if (percentage >= 60) {
                grade = { title: "Probationary Officer (PO)", colorClass: "text-blue", iconName: "zap" };
                animationType = 'confetti';
            } else {
                grade = { title: "Banking Aspirant", colorClass: "text-slate", iconName: "bookOpen" };
                animationType = 'balloons';
            }

            startRewardAnimation(animationType);

            const circleCircumference = 2 * Math.PI * 15.9155;
            const accuracyDash = (accuracy / 100) * circleCircumference;

            container.innerHTML = `
                <div class="result-stack">
                    <!-- Scorecard & Pritam's Note -->
                    <div class="card scorecard">
                        <div class="score-banner ${percentage >= 80 ? 'banner-gold' : 'banner-blue'}">
                            <div class="grade-icon-wrap">
                                ${getSvgIcon(grade.iconName, 34)}
                            </div>
                            <p class="score-kicker">Scorecard for Mallika Naiya</p>
                            <h2 class="score-big">${currentState.score} <span>/ ${maxMarks}</span></h2>
                            <p class="score-sub">Total Marks Obtained (${percentage}%)</p>
                        </div>

                        <div class="grade-strip">
                            ${currentState.wasAutoSubmitted ? '<div style="margin-bottom:0.4rem;"><span class="badge badge-rose">Time Up — Auto Submitted</span></div>' : ''}
                            <h3 class="grade-title ${grade.colorClass}">${grade.title}</h3>
                        </div>

                        <!-- Special Note from Pritam -->
                        <div class="pritam-note-section">
                            <div class="pritam-top-bar"></div>
                            <span class="pritam-badge">
                                ${getSvgIcon('heart', 14)}
                                <span>A Special Note for You from Pritam</span>
                            </span>
                            <p class="pritam-quote">"${currentState.currentMotivation}"</p>
                        </div>
                    </div>

                    <!-- 4-Card Metrics Grid -->
                    <div class="metrics-grid">
                        <div class="card metric-card">
                            <div class="gauge-wrap">
                                <svg viewBox="0 0 36 36" class="circular-chart">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" stroke-dasharray="${accuracyDash}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="gauge-text">${accuracy}%</div>
                            </div>
                            <span class="metric-label">Accuracy</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-purple">${getSvgIcon('clock', 20)}</div>
                            <span class="metric-val">${formatTime(currentState.timeTaken)}</span>
                            <span class="metric-label">Time Taken</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-amber">${getSvgIcon('edit', 20)}</div>
                            <span class="metric-val">${attemptedCount} <small>/ ${totalQuestions}</small></span>
                            <span class="metric-label">Attempted</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-emerald">${getSvgIcon('zap', 20)}</div>
                            <span class="metric-val">${speedPerQ}s</span>
                            <span class="metric-label">Avg Speed / Q</span>
                        </div>
                    </div>

                    <!-- Detailed Breakdown -->
                    <div class="card breakdown-card">
                        <h4 class="breakdown-title">
                            <span class="breakdown-icon">${getSvgIcon('barChart', 18)}</span>
                            <span>Detailed Performance Breakdown</span>
                        </h4>

                        <div class="stacked-bar">
                            <div class="bar-correct" style="width: ${(correctCount / totalQuestions) * 100}%"></div>
                            <div class="bar-wrong" style="width: ${(wrongCount / totalQuestions) * 100}%"></div>
                            <div class="bar-skipped" style="width: ${(skippedCount / totalQuestions) * 100}%"></div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box stat-correct">
                                <span class="stat-num">${correctCount}</span>
                                <span class="stat-lbl">Correct</span>
                            </div>
                            <div class="stat-box stat-wrong">
                                <span class="stat-num">${wrongCount}</span>
                                <span class="stat-lbl">Incorrect</span>
                            </div>
                            <div class="stat-box stat-skipped">
                                <span class="stat-num">${skippedCount}</span>
                                <span class="stat-lbl">Skipped</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-grid">
                        <button onclick="startReview()" class="btn btn-outline-blue">
                            ${getSvgIcon('eye', 18)}
                            <span>Review Rules &amp; Solutions</span>
                        </button>

                        <button onclick="resetQuiz()" class="btn btn-solid-dark">
                            ${getSvgIcon('rotateCcw', 18)}
                            <span>Retake Mock Test</span>
                        </button>
                    </div>
                </div>
            `;
        }

        /* =========================================================
           8. CELEBRATION PARTICLES
           ========================================================= */
        let animationInterval = null;

        function startRewardAnimation(type) {
            animBox.classList.remove('hidden');
            if (animationInterval) clearInterval(animationInterval);

            for (let i = 0; i < 18; i++) {
                createParticle(type);
            }

            const intervalTime = type === 'coins' ? 220 : 320;
            animationInterval = setInterval(() => {
                createParticle(type);
            }, intervalTime);
        }

        function stopRewardAnimation() {
            animBox.classList.add('hidden');
            animBox.innerHTML = '';
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        function createParticle(type) {
            const el = document.createElement('div');
            el.classList.add('particle');
            const randomX = Math.random() * 96;

            if (type === 'coins') {
                el.classList.add('coin');
                el.textContent = '₹';
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = '34px';
                el.style.height = '34px';
                el.style.fontSize = '20px';
                el.style.animationDuration = (Math.random() * 1.5 + 1.8) + 's';
            } else if (type === 'confetti') {
                el.classList.add('confetti');
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = (Math.random() * 10 + 6) + 'px';
                el.style.height = (Math.random() * 10 + 6) + 'px';
                el.style.backgroundColor = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6'][Math.floor(Math.random() * 5)];
                el.style.animationDuration = (Math.random() * 2.5 + 2.2) + 's';
            } else {
                el.classList.add('balloon');
                el.style.left = randomX + '%';
                el.style.top = '105vh';
                el.style.width = '32px';
                el.style.height = '42px';
                el.style.backgroundColor = ['#FCA5A5', '#93C5FD', '#6EE7B7', '#FDE047'][Math.floor(Math.random() * 4)];
                el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            }

            animBox.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 7500);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
