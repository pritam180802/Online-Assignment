        /* --- Reward Particle Keyframes --- */
        @keyframes fall {

        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.85; }

        }

        /* --- Particle Elements --- */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 50;
        }

        .confetti {
            animation-name: fall;
            animation-timing-function: linear;
        }

            animation-timing-function: ease-in;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #b45309;

            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.12);

        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const btnBackResult = document.getElementById('btn-back-result');
        const animBox = document.getElementById('animation-container');
        const timerText = document.getElementById('timer-text');
        const timerBox = document.getElementById('timer-box');

        // --- INITIALIZATION & TIMER ---
        function init() {
            startTimer();
            render();
        }

        function resetQuiz() {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
            }
            const prevQuoteIdx = currentState.lastQuoteIndex;
            currentState = {
                mode: 'quiz',
                currentIndex: 0,
                answers: {},
                score: 0,
                timeLeft: quizData.totalTimeSeconds,
                timerId: null,
                timeTaken: 0,
                wasAutoSubmitted: false,
                currentMotivation: "",
                lastQuoteIndex: prevQuoteIdx
            };
            stopRewardAnimation();
            startTimer();
            render();
        }

        function startTimer() {
            updateTimerDisplay();
            currentState.timerId = setInterval(() => {
                currentState.timeLeft--;
                currentState.timeTaken++;
                updateTimerDisplay();
                if (currentState.timeLeft <= 0) {
                    calculateScore(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const safeTime = Math.max(0, currentState.timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (safeTime <= 60 && currentState.mode === 'quiz') {
                timerBox.classList.remove('bg-blue-900', 'border-blue-700');
                timerBox.classList.add('bg-red-600', 'border-red-400', 'animate-pulse');
            } else {
                timerBox.classList.remove('bg-red-600', 'border-red-400', 'animate-pulse');
                timerBox.classList.add('bg-blue-900', 'border-blue-700');
            }
        }

        // --- USER INTERACTIONS ---
        function selectAnswer(qIndex, optIndex) {
            if (currentState.mode !== 'quiz') return;
            currentState.answers[qIndex] = optIndex;
            render();
        }

        function jumpToQuestion(index) {
            if (index >= 0 && index < quizData.questions.length) {
                currentState.currentIndex = index;
                render();
            }
        }

        function nextQuestion() {
            if (currentState.currentIndex < quizData.questions.length - 1) {
                currentState.currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentState.currentIndex > 0) {
                currentState.currentIndex--;
                render();
            }
        }

        function pickDifferentQuote() {
            let idx = Math.floor(Math.random() * motivationalQuotes.length);
            if (motivationalQuotes.length > 1 && idx === currentState.lastQuoteIndex) {
                idx = (idx + 1) % motivationalQuotes.length;
            }
            currentState.lastQuoteIndex = idx;
            return motivationalQuotes[idx];
        }

        function calculateScore(autoSubmit = false) {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
                currentState.timerId = null;
            }

            let totalScore = 0;
            quizData.questions.forEach((q, idx) => {
                if (currentState.answers[idx] === q.correct) {
                    totalScore += quizData.marksPerQuestion;
                }
            });

            currentState.score = totalScore;
            currentState.mode = 'result';
            currentState.wasAutoSubmitted = autoSubmit;
            currentState.currentMotivation = pickDifferentQuote();

            updateTimerDisplay();
            render();
        }

        function startReview() {
            currentState.mode = 'review';
            currentState.currentIndex = 0;
            render();
        }

        function showResult() {
            currentState.mode = 'result';
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        // --- MAIN RENDER DISPATCHER ---
        function render() {
            container.innerHTML = '';
            stopRewardAnimation();

            if (currentState.mode === 'quiz' || currentState.mode === 'review') {
                footer.classList.remove('hidden');
                renderQuestionView();
            } else {
                footer.classList.add('hidden');
                renderResultView();
            }

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // --- QUESTION & REVIEW VIEW ---
        function renderQuestionView() {
            const q = quizData.questions[currentState.currentIndex];
            const isReview = currentState.mode === 'review';
            const totalQ = quizData.questions.length;
            const progress = ((currentState.currentIndex + 1) / totalQ) * 100;
            const selectedAnswer = currentState.answers[currentState.currentIndex];

            // Question Palette Pills
            let paletteHtml = '';
            quizData.questions.forEach((item, idx) => {
                const isCurrent = idx === currentState.currentIndex;
                const ans = currentState.answers[idx];
                let pillClass = 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200';

                if (isReview) {
                    if (ans === item.correct) {
                        pillClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
                    } else if (ans !== undefined) {
                        pillClass = 'bg-rose-100 text-rose-800 border-rose-300';
                    }
                } else if (ans !== undefined) {
                    pillClass = 'bg-blue-100 text-blue-800 border-blue-300 font-bold';
                }

                if (isCurrent) {
                    pillClass += ' ring-2 ring-blue-600 ring-offset-1 font-extrabold';
                }

                paletteHtml += `
                    <button onclick="jumpToQuestion(${idx})" class="w-8 h-8 rounded-lg text-xs border transition-all flex items-center justify-center ${pillClass}">
                        ${idx + 1}
                    </button>
                `;
            });

            // Header Card
            const headerHtml = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 mb-6">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-slate-800">${quizData.title}</span>
                            <span class="text-xs bg-blue-50 text-blue-700 border border-blue-100 px-2.5 py-0.5 rounded-full font-bold">${q.setLabel}</span>
                            ${isReview ? '<span class="text-xs bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">SOLUTIONS</span>' : ''}
                        </div>
                        <div class="text-sm font-bold text-slate-500">
                            Question ${currentState.currentIndex + 1} of ${totalQ}
                        </div>
                    </div>
                    <div class="h-1.5 bg-slate-100 w-full rounded-full overflow-hidden mb-4">
                        <div class="h-full bg-blue-600 transition-all duration-300" style="width: ${progress}%"></div>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${paletteHtml}
                    </div>
                </div>
            `;

            // Puzzle Context Box
            const contextHtml = q.context ? `
                <div class="bg-blue-50/70 p-5 md:p-6 rounded-2xl border border-blue-100 mb-6 text-slate-700 text-sm md:text-base leading-relaxed">
                    ${q.context}
                </div>
            ` : '';

            // Options List
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isSelected = selectedAnswer === idx;
                const isCorrect = q.correct === idx;

                let btnClass = 'border-slate-200 hover:border-blue-300 hover:bg-blue-50/40';
                let badgeClass = 'bg-slate-100 text-slate-600 border-slate-300 group-hover:bg-blue-100 group-hover:text-blue-700';
                let textClass = 'text-slate-700';
                let iconHtml = '';

                if (isReview) {
                    if (isCorrect) {
                        btnClass = 'bg-emerald-50 border-emerald-500 ring-1 ring-emerald-500';
                        badgeClass = 'bg-emerald-600 text-white border-emerald-600';
                        textClass = 'text-emerald-950 font-bold';
                        iconHtml = '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>';
                    } else if (isSelected && !isCorrect) {
                        btnClass = 'bg-rose-50 border-rose-400';
                        badgeClass = 'bg-rose-500 text-white border-rose-500';
                        textClass = 'text-rose-900 font-semibold';
                        iconHtml = '<i data-lucide="x-circle" class="w-5 h-5 text-rose-500 shrink-0"></i>';
                    } else {
                        btnClass = 'border-slate-100 opacity-55 bg-slate-50/60';
                    }
                } else if (isSelected) {
                    btnClass = 'border-blue-600 bg-blue-50/80 ring-1 ring-blue-600 shadow-sm';
                    badgeClass = 'bg-blue-600 text-white border-blue-600';
                    textClass = 'text-blue-950 font-bold';
                }

                optionsHtml += `
                    <button 
                        onclick="selectAnswer(${currentState.currentIndex}, ${idx})"
                        ${isReview ? 'disabled' : ''}
                        class="w-full text-left p-4 rounded-2xl border-2 transition-all duration-150 flex items-center justify-between gap-3 group mb-3 ${btnClass}"
                    >
                        <div class="flex items-center gap-3.5">
                            <span class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border shrink-0 transition-colors ${badgeClass}">
                                ${String.fromCharCode(65 + idx)}
                            </span>
                            <span class="text-base md:text-lg ${textClass}">${opt}</span>
                        </div>
                        ${iconHtml}
                    </button>
                `;
            });

            // Solution Explanation (Review Mode Only)
            const explanationHtml = (isReview && q.explanation) ? `
                <div class="mt-6 bg-amber-50/90 p-5 rounded-2xl border border-amber-200 text-amber-950 text-sm md:text-base leading-relaxed">
                    <div class="font-bold text-amber-800 flex items-center gap-2 mb-1.5">
                        <i data-lucide="lightbulb" class="w-4 h-4 text-amber-600"></i>
                        <span>Final Seating Arrangement & Solution</span>
                    </div>
                    <p>${q.explanation}</p>
                </div>
            ` : '';

            // Inject Complete Question View
            container.innerHTML = `
                ${headerHtml}
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8 animate-fade-in">
                    ${contextHtml}
                    <h2 class="text-lg md:text-xl font-bold text-slate-900 leading-relaxed mb-6">
                        Q${currentState.currentIndex + 1}. ${q.text}
                    </h2>
                    <div>${optionsHtml}</div>
                    ${explanationHtml}
                </div>
            `;

            // Configure Footer Buttons
            btnPrev.disabled = currentState.currentIndex === 0;
            btnNext.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            btnBackResult.classList.add('hidden');

            if (currentState.currentIndex < totalQ - 1) {
                btnNext.classList.remove('hidden');
            } else if (isReview) {
                btnBackResult.classList.remove('hidden');
            } else {
                btnSubmit.classList.remove('hidden');
            }
        }

        // --- RESULT & ANALYTICS VIEW ---
        function renderResultView() {
            const totalQuestions = quizData.questions.length;
            const maxMarks = totalQuestions * quizData.marksPerQuestion;
            const attemptedCount = Object.keys(currentState.answers).length;
            const correctCount = currentState.score / quizData.marksPerQuestion;
            const wrongCount = attemptedCount - correctCount;
            const skippedCount = totalQuestions - attemptedCount;
            const percentage = Math.round((currentState.score / maxMarks) * 100);
            const accuracy = attemptedCount > 0 ? Math.round((correctCount / attemptedCount) * 100) : 0;
            const speedPerQ = attemptedCount > 0 ? Math.round(currentState.timeTaken / attemptedCount) : 0;

            let grade, animationType;
            if (percentage >= 80) {
                grade = { title: "Future Bank Manager!", color: "text-amber-600", icon: "crown" };
                animationType = 'coins';
            } else if (percentage >= 60) {
                grade = { title: "Probationary Officer (PO)", color: "text-blue-600", icon: "zap" };
                animationType = 'confetti';
            } else {
                grade = { title: "Banking Aspirant", color: "text-slate-700", icon: "book-open" };
                animationType = 'balloons';
            }

            startRewardAnimation(animationType);

            const circleCircumference = 2 * Math.PI * 15.9155;
            const accuracyDash = (accuracy / 100) * circleCircumference;

            container.innerHTML = `
                <div class="flex flex-col gap-6 animate-fade-in">
                    
                    <!-- Main Scorecard & Pritam's Note -->
                    <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
                        <div class="p-8 ${percentage >= 80 ? 'bg-gradient-to-br from-amber-400 via-orange-500 to-amber-600' : 'bg-gradient-to-br from-blue-800 via-blue-900 to-indigo-950'} text-white text-center relative overflow-hidden">
                            <div class="relative z-10">
                                <div class="bg-white/20 w-16 h-16 mx-auto rounded-2xl flex items-center justify-center backdrop-blur-sm mb-3 border border-white/30">
                                    <i data-lucide="${grade.icon}" class="w-9 h-9 text-white"></i>
                                </div>
                                <p class="text-xs font-bold uppercase tracking-widest opacity-90 mb-1">Scorecard for Mallika Naiya</p>
                                <h2 class="text-5xl font-black tracking-tight">${currentState.score} <span class="text-2xl opacity-75 font-semibold">/ ${maxMarks}</span></h2>
                                <p class="text-xs font-bold opacity-85 tracking-widest uppercase mt-2">Total Marks Obtained (${percentage}%)</p>
                            </div>
                        </div>

                        <div class="p-4 text-center border-b border-slate-100 bg-slate-50/70">
                            ${currentState.wasAutoSubmitted ? '<span class="inline-block mb-1.5 px-3 py-0.5 bg-rose-100 text-rose-700 text-xs font-bold rounded-full">Time Up — Auto Submitted</span>' : ''}
                            <h3 class="text-xl md:text-2xl font-extrabold ${grade.color}">${grade.title}</h3>
                        </div>

                        <!-- Romantic + Motivational Note from Pritam -->
                        <div class="p-6 md:p-8 bg-gradient-to-b from-white to-rose-50/40 text-center relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-rose-400 via-pink-500 to-indigo-500"></div>
                            
                            <span class="inline-flex items-center gap-1.5 px-4 py-1.5 bg-rose-50 text-rose-600 text-xs font-extrabold uppercase tracking-widest rounded-full mb-4 border border-rose-100 shadow-sm">
                                <i data-lucide="heart" class="w-3.5 h-3.5 fill-rose-500 text-rose-500"></i>
                                <span>A Special Note for You from Pritam</span>
                            </span>
                            
                            <div class="relative max-w-2xl mx-auto">
                                <p class="text-slate-700 font-serif italic text-lg md:text-xl leading-relaxed px-4 font-medium">
                                    "${currentState.currentMotivation}"
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- 4-Card Metrics Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                            <div class="relative w-16 h-16 mb-2">
                                <svg viewBox="0 0 36 36" class="circular-chart text-blue-600">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" stroke-dasharray="${accuracyDash}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke="currentColor" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center text-xs font-black text-slate-800">${accuracy}%</div>
                            </div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Accuracy</span>
                        </div>

                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                            <div class="w-11 h-11 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center mb-2">
                                <i data-lucide="clock" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${formatTime(currentState.timeTaken)}</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-0.5">Time Taken</span>
                        </div>

                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                            <div class="w-11 h-11 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mb-2">
                                <i data-lucide="edit-3" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${attemptedCount} <span class="text-xs font-bold text-slate-400">/ ${totalQuestions}</span></span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-0.5">Attempted</span>
                        </div>

                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center">
                            <div class="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center mb-2">
                                <i data-lucide="zap" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${speedPerQ}s</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-0.5">Avg Speed / Q</span>
                        </div>
                    </div>

                    <!-- Detailed Question Breakdown -->
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 md:p-8">
                        <h4 class="font-extrabold text-slate-800 mb-5 flex items-center gap-2.5 text-lg">
                            <span class="bg-blue-100 p-2 rounded-xl text-blue-600"><i data-lucide="bar-chart-2" class="w-5 h-5"></i></span>
                            <span>Detailed Performance Breakdown</span>
                        </h4>
                        
                        <div class="flex h-4 rounded-full overflow-hidden mb-6 bg-slate-100 shadow-inner">
                            <div style="width: ${(correctCount / totalQuestions) * 100}%" class="bg-emerald-500 transition-all duration-500"></div>
                            <div style="width: ${(wrongCount / totalQuestions) * 100}%" class="bg-rose-500 transition-all duration-500"></div>
                            <div style="width: ${(skippedCount / totalQuestions) * 100}%" class="bg-slate-300 transition-all duration-500"></div>
                        </div>

                        <div class="grid grid-cols-3 gap-3 md:gap-4 text-center">
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <span class="block text-2xl md:text-3xl font-black text-emerald-600">${correctCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Correct</span>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                                <span class="block text-2xl md:text-3xl font-black text-rose-600">${wrongCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Incorrect</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                <span class="block text-2xl md:text-3xl font-black text-slate-500">${skippedCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Skipped</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onclick="startReview()" class="w-full bg-white text-blue-700 border-2 border-blue-200 py-4 rounded-2xl font-bold hover:bg-blue-50 transition-all flex items-center justify-center gap-2 shadow-sm">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                            <span>Review Arrangements & Solutions</span>
                        </button>

                        <button onclick="resetQuiz()" class="w-full bg-slate-900 text-white border-2 border-slate-900 py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-lg flex items-center justify-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                            <span>Retake Mock Test</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- CELEBRATION REWARD PARTICLES ---
        let animationInterval = null;

        function startRewardAnimation(type) {
            animBox.classList.remove('hidden');
            if (animationInterval) clearInterval(animationInterval);

            for (let i = 0; i < 18; i++) {
                createParticle(type);
            }

            const intervalTime = type === 'coins' ? 220 : 320;
            animationInterval = setInterval(() => {
                createParticle(type);
            }, intervalTime);
        }

        function stopRewardAnimation() {
            animBox.classList.add('hidden');
            animBox.innerHTML = '';
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        function createParticle(type) {
            const el = document.createElement('div');
            el.classList.add('particle');
            const randomX = Math.random() * 96;

            if (type === 'coins') {
                el.classList.add('coin');
                el.textContent = '₹';
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = '34px';
                el.style.height = '34px';
                el.style.fontSize = '20px';
                el.style.animationDuration = (Math.random() * 1.5 + 1.8) + 's';
            } else if (type === 'confetti') {
                el.classList.add('confetti');
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = (Math.random() * 10 + 6) + 'px';
                el.style.height = (Math.random() * 10 + 6) + 'px';
                el.style.backgroundColor = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6'][Math.floor(Math.random() * 5)];
                el.style.animationDuration = (Math.random() * 2.5 + 2.2) + 's';
            } else {
                el.classList.add('balloon');
                el.style.left = randomX + '%';
                el.style.top = '105vh';
                el.style.width = '32px';
                el.style.height = '42px';
                el.style.backgroundColor = ['#FCA5A5', '#93C5FD', '#6EE7B7', '#FDE047'][Math.floor(Math.random() * 4)];
                el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            }

            animBox.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 7500);
        }

        // Start Application on Load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
