<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking PO Reasoning Mock — Mallika Naiya</title>

    <style>
        /* =========================================================
           1. RESET, DESIGN TOKENS & BASE STYLES (ZERO DEPENDENCIES)
           ========================================================= */
        :root {
            --bg-page: #f1f5f9;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --blue-950: #172554;
            --blue-900: #1e3a8a;
            --blue-800: #1e40af;
            --blue-600: #2563eb;
            --blue-100: #dbeafe;
            --blue-50: #eff6ff;
            --emerald-600: #059669;
            --emerald-500: #10b981;
            --emerald-100: #d1fae5;
            --emerald-50: #ecfdf5;
            --amber-600: #d97706;
            --amber-500: #f59e0b;
            --amber-100: #fef3c7;
            --rose-600: #e11d48;
            --rose-500: #f43f5e;
            --rose-100: #ffe4e6;
            --rose-50: #fff1f2;
            --purple-600: #9333ea;
            --purple-100: #f3e8ff;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-xl: 0 20px 30px -10px rgba(15, 23, 42, 0.14);
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           2. TOP STICKY HEADER & TIMER
           ========================================================= */
        .top-header {
            background: linear-gradient(135deg, var(--blue-950), var(--blue-900));
            color: #ffffff;
            padding: 0.85rem 1.25rem;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .header-inner {
            max-width: 880px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .brand-box:hover {
            opacity: 0.9;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            color: #facc15;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .brand-sub {
            font-size: 0.78rem;
            color: #bfdbfe;
            font-weight: 500;
        }

        .timer-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.45rem 0.9rem;
            border-radius: 12px;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }

        .timer-pill svg {
            color: #facc15;
        }

        #timer-text {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .timer-danger {
            background: var(--rose-600) !important;
            border-color: #fda4af !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* =========================================================
           3. MAIN CONTAINER & CARDS
           ========================================================= */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            padding: 1.25rem 1rem 6.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .header-card {
            padding: 1.15rem 1.25rem;
            margin-bottom: 1.25rem;
        }

        .header-card-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.85rem;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .quiz-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .badge-blue {
            background: var(--blue-100);
            color: var(--blue-800);
        }

        .badge-amber {
            background: var(--amber-100);
            color: var(--amber-600);
        }

        .badge-rose {
            background: var(--rose-100);
            color: var(--rose-600);
        }

        .q-counter {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .quick-submit-btn {
            background: var(--emerald-50);
            color: var(--emerald-600);
            border: 1px solid #a7f3d0;
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-submit-btn:hover {
            background: var(--emerald-600);
            color: #ffffff;
            border-color: var(--emerald-600);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue-600), var(--blue-900));
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* Question Jump Palette */
        .palette-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
        }

        .palette-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 1.5px solid var(--border-light);
            background: var(--bg-subtle);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .palette-btn:hover {
            border-color: var(--blue-600);
            color: var(--blue-600);
        }

        .palette-answered {
            background: var(--blue-100);
            border-color: var(--blue-600);
            color: var(--blue-900);
        }

        .palette-correct {
            background: var(--emerald-100);
            border-color: var(--emerald-600);
            color: var(--emerald-600);
        }

        .palette-wrong {
            background: var(--rose-100);
            border-color: var(--rose-600);
            color: var(--rose-600);
        }

        .palette-current {
            box-shadow: 0 0 0 2.5px rgba(37, 99, 235, 0.35);
            transform: translateY(-1px);
        }

        /* =========================================================
           4. QUESTION & OPTIONS CARD
           ========================================================= */
        .question-card {
            padding: 1.5rem;
        }

        @media (min-width: 640px) {
            .question-card {
                padding: 2rem;
            }
        }

        .passage-box {
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--blue-800);
            border-radius: 12px;
            padding: 1rem 1.15rem;
            margin-bottom: 1.35rem;
            font-size: 0.94rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }

        .passage-header {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--blue-900);
            margin-bottom: 0.4rem;
        }

        .question-text {
            font-size: 1.12rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            width: 100%;
            text-align: left;
            padding: 0.95rem 1.1rem;
            margin-bottom: 0.75rem;
            border-radius: 14px;
            border: 2px solid var(--border-light);
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.18s ease;
            font-family: inherit;
            font-size: 0.98rem;
            color: var(--text-main);
        }

        .option-btn:hover:not(:disabled) {
            background: var(--bg-subtle);
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .option-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid #cbd5e1;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.18s ease;
        }

        .option-label {
            font-weight: 500;
        }

        .option-selected {
            border-color: var(--blue-600);
            background: var(--blue-50);
            box-shadow: 0 0 0 1px var(--blue-600);
        }

        .option-selected .option-badge {
            background: var(--blue-600);
            border-color: var(--blue-600);
            color: #ffffff;
        }

        .option-selected .option-label {
            font-weight: 700;
            color: var(--blue-900);
        }

        .option-correct {
            background: var(--emerald-50);
            border-color: var(--emerald-500);
            color: #065f46;
            box-shadow: 0 0 0 1px var(--emerald-500);
        }

        .option-correct .option-badge {
            background: var(--emerald-600);
            border-color: var(--emerald-600);
            color: #ffffff;
        }

        .option-correct .option-label {
            font-weight: 700;
        }

        .option-wrong {
            background: var(--rose-50);
            border-color: var(--rose-500);
            color: #9f1239;
        }

        .option-wrong .option-badge {
            background: var(--rose-500);
            border-color: var(--rose-500);
            color: #ffffff;
        }

        .option-dimmed {
            opacity: 0.55;
        }

        .explanation-box {
            margin-top: 1.25rem;
            padding: 1rem 1.15rem;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-left: 4px solid var(--blue-600);
            font-size: 0.92rem;
            color: var(--text-secondary);
        }

        .explanation-header {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 800;
            color: var(--blue-900);
            margin-bottom: 0.35rem;
        }

        /* =========================================================
           5. STICKY FOOTER NAVIGATION
           ========================================================= */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-light);
            padding: 0.85rem 1rem;
            z-index: 25;
        }

        .footer-inner {
            max-width: 880px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            padding: 0.75rem 1.35rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-prev {
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        .btn-prev:hover:not(:disabled) {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .btn-next {
            background: var(--blue-900);
            color: #ffffff;
        }

        .btn-next:hover {
            background: var(--blue-800);
        }

        .btn-submit {
            background: var(--emerald-600);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.25);
        }

        .btn-submit:hover {
            background: #047857;
        }

        .btn-dark {
            background: var(--text-main);
            color: #ffffff;
        }

        .btn-dark:hover {
            background: #1e293b;
        }

        /* =========================================================
           6. RESULT SCORECARD, PRITAM'S NOTE & ANALYTICS
           ========================================================= */
        .result-stack {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .scorecard {
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
        }

        .score-banner {
            padding: 2rem 1.5rem;
            text-align: center;
            color: #ffffff;
        }

        .banner-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .banner-blue {
            background: linear-gradient(135deg, var(--blue-950), var(--blue-800));
        }

        .grade-icon-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 0.75rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-kicker {
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.9;
            margin-bottom: 0.25rem;
        }

        .score-big {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .score-big span {
            font-size: 1.35rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .score-sub {
            font-size: 0.9rem;
            opacity: 0.92;
            margin-top: 0.35rem;
        }

        .grade-strip {
            padding: 1rem 1.25rem;
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }

        .grade-title {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .text-amber { color: var(--amber-600); }
        .text-blue { color: var(--blue-600); }
        .text-slate { color: var(--text-secondary); }

        /* Pritam's Special Note */
        .pritam-note-section {
            position: relative;
            padding: 1.65rem 1.5rem;
            background: linear-gradient(180deg, #fff1f2 0%, #f8fafc 100%);
            text-align: center;
        }

        .pritam-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #ec4899, #f59e0b);
        }

        .pritam-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            background: #ffe4e6;
            color: #be123c;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.85rem;
        }

        .pritam-quote {
            font-family: Georgia, "Times New Roman", serif;
            font-style: italic;
            font-size: 1.08rem;
            color: #1e293b;
            line-height: 1.65;
            max-width: 640px;
            margin: 0 auto;
        }

        /* 4-Card Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.85rem;
        }

        @media (min-width: 640px) {
            .metrics-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .metric-card {
            padding: 1.15rem 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .gauge-wrap {
            position: relative;
            width: 62px;
            height: 62px;
            margin-bottom: 0.5rem;
        }

        .circular-chart {
            width: 100%;
            height: 100%;
            color: var(--blue-600);
        }

        .circle-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 3.6;
        }

        .circle {
            fill: none;
            stroke-width: 3.2;
            stroke-linecap: round;
            animation: progress 1s ease-out forwards;
        }

        @keyframes progress {
            0% { stroke-dasharray: 0, 100; }
        }

        .gauge-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .metric-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .icon-purple { background: var(--purple-100); color: var(--purple-600); }
        .icon-amber { background: var(--amber-100); color: var(--amber-600); }
        .icon-emerald { background: var(--emerald-100); color: var(--emerald-600); }

        .metric-val {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .metric-val small {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .metric-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        /* Breakdown Card */
        .breakdown-card {
            padding: 1.35rem;
        }

        .breakdown-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .breakdown-icon {
            color: var(--blue-600);
            display: flex;
        }

        .stacked-bar {
            display: flex;
            height: 12px;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 1.15rem;
        }

        .bar-correct { background: var(--emerald-500); transition: width 0.5s ease; }
        .bar-wrong { background: var(--rose-500); transition: width 0.5s ease; }
        .bar-skipped { background: #cbd5e1; transition: width 0.5s ease; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
            text-align: center;
        }

        .stat-box {
            padding: 0.75rem 0.5rem;
            border-radius: 12px;
            background: var(--bg-subtle);
        }

        .stat-num {
            display: block;
            font-size: 1.45rem;
            font-weight: 900;
        }

        .stat-lbl {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stat-correct .stat-num { color: var(--emerald-600); }
        .stat-wrong .stat-num { color: var(--rose-600); }
        .stat-skipped .stat-num { color: var(--text-muted); }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .action-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .btn {
            width: 100%;
            padding: 0.95rem 1.25rem;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-outline-blue {
            background: var(--blue-100);
            color: var(--blue-900);
        }

        .btn-outline-blue:hover {
            background: #bfdbfe;
        }

        .btn-solid-dark {
            background: var(--text-main);
            color: #ffffff;
        }

        .btn-solid-dark:hover {
            background: #1e293b;
        }

        /* =========================================================
           7. CELEBRATION PARTICLES
           ========================================================= */
        .animation-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(112vh) rotate(720deg); opacity: 0; }
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.85; }
            100% { transform: translateY(-120vh) translateX(24px) rotate(12deg); opacity: 0; }
        }

        .confetti {
            animation-name: fall;
            animation-timing-function: linear;
            border-radius: 3px;
        }

        .coin {
            animation-name: fall;
            animation-timing-function: ease-in;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #78350f;
            border: 2px solid #b45309;
            background: radial-gradient(circle at 30% 30%, #fde68a, #f59e0b);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.22);
        }

        .balloon {
            animation-name: rise;
            animation-timing-function: ease-out;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Top Sticky Header with Countdown Timer -->
    <header class="top-header">
        <div class="header-inner">
            <div class="brand-box" onclick="resetQuiz()" title="Restart Mock Test">
                <div class="brand-icon" id="header-bank-icon"></div>
                <div>
                    <div class="brand-title">Banking Mock Test</div>
                    <div class="brand-sub">Candidate: Mallika Naiya</div>
                </div>
            </div>

            <div id="timer-box" class="timer-pill">
                <span id="header-clock-icon" style="display:flex;"></span>
                <span id="timer-text">50:00</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="main-container"></main>

    <!-- Bottom Navigation Footer -->
    <footer id="footer-nav" class="footer-nav hidden">
        <div class="footer-inner">
            <button id="btn-prev" onclick="prevQuestion()" class="nav-btn btn-prev">
                <span id="icon-prev" style="display:flex;"></span>
                <span>Previous</span>
            </button>

            <button id="btn-next" onclick="nextQuestion()" class="nav-btn btn-next hidden">
                <span>Next Question</span>
                <span id="icon-next" style="display:flex;"></span>
            </button>

            <button id="btn-submit" onclick="calculateScore(false)" class="nav-btn btn-submit hidden">
                <span>Submit Test</span>
            </button>

            <button id="btn-back-result" onclick="showResult()" class="nav-btn btn-dark hidden">
                <span>View Report</span>
            </button>
        </div>
    </footer>

    <!-- Celebration Particle Overlay -->
    <div id="animation-container" class="animation-overlay hidden"></div>

    <script>
        /* =========================================================
           1. INLINE SVG ICON SYSTEM (ZERO EXTERNAL DEPENDENCIES)
           ========================================================= */
        function getSvgIcon(name, size = 18) {
            const icons = {
                building: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>',
                clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
                arrowLeft: '<path d="m15 18-6-6 6-6"/>',
                arrowRight: '<path d="m9 18 6-6-6-6"/>',
                checkCircle: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
                xCircle: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
                lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
                crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>',
                zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
                bookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
                heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
                edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
                barChart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
                eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
                rotateCcw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'
            };
            const inner = icons[name] || '';
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
        }

        /* =========================================================
           2. QUIZ DATA: 12 CIRCULAR SEATING ARRANGEMENT QUESTIONS (4 SETS)
           ========================================================= */
        const SET_1_DIRECTIONS = "Eight persons viz. A, B, C, D, E, F, G, and H are sitting around a circular table such that all of them are facing towards the centre, but not necessarily in the same order. H sits three persons away from B and sits to the immediate right of A. C sits third to the left of A. Only two persons sit between C and D, who sits to the immediate right of H. E sits to the immediate right of G. F does not sit adjacent to A.";
        const SET_2_DIRECTIONS = "Eight persons viz. M, N, O, P, Q, R, T, and W are sitting around a circular table such that all of them are facing towards the centre, but not necessarily in the same order. N sits two persons away from M, who sits third to the left of O. M sits exactly in the middle of P and R. Q sits third to the right of P and is not adjacent to R. At least two persons sit between T and W when counted from both sides. T is not adjacent to Q.";
        const SET_3_DIRECTIONS = "Eight persons viz. A, B, C, D, E, F, G, and H are sitting around a circular table facing the centre, but not necessarily in the same order. C sits third to the left of A. D sits two persons away from C. E sits opposite to A. F sits second to the right of D. B is not an immediate neighbour of A or C. G sits to the immediate right of C.";
        const SET_4_DIRECTIONS = "Ten people viz. K, L, M, N, P, Q, R, S, T, and V are seated around a circular table such that all of them are facing towards the centre, but not necessarily in the same order. R sits third to the left of the one who faces towards L. Two persons sit between L and P. K faces towards L. M sits immediate right of P. T sits immediate left of R. Q sits second to the left of L. As many persons sit between P and K as between V and Q, when counted from the right of both P and V. S sits to the immediate right of V.";

        const quizData = {
            title: "Reasoning: Circular Seating Arrangement",
            totalTimeSeconds: 50 * 60, // 50 Minutes
            marksPerQuestion: 2,
            questions: [
                {
                    id: 1,
                    setLabel: "Set 1 (Q1–Q3)",
                    passage: SET_1_DIRECTIONS,
                    text: "Who sits to the immediate left of C?",
                    options: ["G", "E", "B", "F", "D"],
                    correct: 2,
                    explanation: "Final Arrangement (Clockwise): A – E – G – C – B – F – D – H. Facing the centre, clockwise is to the left, so B sits to the immediate left of C."
                },
                {
                    id: 2,
                    setLabel: "Set 1 (Q1–Q3)",
                    passage: SET_1_DIRECTIONS,
                    text: "How many persons sit between G and H when counted from the right of G?",
                    options: ["One", "Two", "Three", "Four", "None"],
                    correct: 1,
                    explanation: "Final Arrangement (Clockwise): A – E – G – C – B – F – D – H. Counting to the right (anti-clockwise) of G toward H, two persons (E and A) sit between them."
                },
                {
                    id: 3,
                    setLabel: "Set 1 (Q1–Q3)",
                    passage: SET_1_DIRECTIONS,
                    text: "Who among the following sits exactly opposite to E?",
                    options: ["D", "B", "H", "F", "C"],
                    correct: 3,
                    explanation: "Final Arrangement (Clockwise): A – E – G – C – B – F – D – H. In this 8-person circle, F sits 4 places away (exactly opposite) from E."
                },
                {
                    id: 4,
                    setLabel: "Set 2 (Q4–Q6)",
                    passage: SET_2_DIRECTIONS,
                    text: "Who sits second to the right of O?",
                    options: ["N", "W", "R", "P", "M"],
                    correct: 1,
                    explanation: "Final Arrangement (Clockwise): R – N – W – Q – O – T – P – M. Moving anti-clockwise (to the right) from O: Q is immediate right, and W is second to the right."
                },
                {
                    id: 5,
                    setLabel: "Set 2 (Q4–Q6)",
                    passage: SET_2_DIRECTIONS,
                    text: "Who among the following sits opposite to N?",
                    options: ["P", "Q", "O", "T", "M"],
                    correct: 3,
                    explanation: "Final Arrangement (Clockwise): R – N – W – Q – O – T – P – M. T sits directly opposite to N."
                },
                {
                    id: 6,
                    setLabel: "Set 2 (Q4–Q6)",
                    passage: SET_2_DIRECTIONS,
                    text: "Which of the following pairs represents the immediate neighbours of Q?",
                    options: ["W and O", "N and W", "O and T", "R and N", "P and M"],
                    correct: 0,
                    explanation: "Final Arrangement (Clockwise): R – N – W – Q – O – T – P – M. Q sits directly between W and O."
                },
                {
                    id: 7,
                    setLabel: "Set 3 (Q7–Q9)",
                    passage: SET_3_DIRECTIONS,
                    text: "Who sits third to the right of H?",
                    options: ["G", "D", "C", "A", "F"],
                    correct: 2,
                    explanation: "Final Arrangement (Clockwise): A – D – G – C – E – B – H – F. Moving to the right (anti-clockwise) from H: B (1st), E (2nd), and C (3rd)."
                },
                {
                    id: 8,
                    setLabel: "Set 3 (Q7–Q9)",
                    passage: SET_3_DIRECTIONS,
                    text: "How many persons sit between D and B when counted from the left of D?",
                    options: ["One", "Two", "Three", "Four", "None"],
                    correct: 2,
                    explanation: "Final Arrangement (Clockwise): A – D – G – C – E – B – H – F. Counting clockwise (left) from D to B, three persons (G, C, and E) sit between them."
                },
                {
                    id: 9,
                    setLabel: "Set 3 (Q7–Q9)",
                    passage: SET_3_DIRECTIONS,
                    text: "Four of the following five are alike in a certain way based on their seating positions and hence form a group. Which one does not belong to that group?",
                    options: ["A - E", "D - B", "G - H", "C - F", "B - F"],
                    correct: 4,
                    explanation: "Final Arrangement (Clockwise): A – D – G – C – E – B – H – F. A-E, D-B, G-H, and C-F all sit directly opposite to each other, whereas B and F are not opposite."
                },
                {
                    id: 10,
                    setLabel: "Set 4 (Q10–Q12)",
                    passage: SET_4_DIRECTIONS,
                    text: "Who among the following sits fifth to the left of M?",
                    options: ["Q", "N", "L", "S", "R"],
                    correct: 1,
                    explanation: "Final Arrangement (Clockwise): K – M – P – R – T – L – N – Q – S – V. Counting 5 places clockwise (left) from M: P (1), R (2), T (3), L (4), N (5)."
                },
                {
                    id: 11,
                    setLabel: "Set 4 (Q10–Q12)",
                    passage: SET_4_DIRECTIONS,
                    text: "Who sits opposite to P?",
                    options: ["S", "V", "Q", "N", "T"],
                    correct: 2,
                    explanation: "Final Arrangement (Clockwise): K – M – P – R – T – L – N – Q – S – V. In a 10-person circle, Q sits 5 places away (directly opposite) from P."
                },
                {
                    id: 12,
                    setLabel: "Set 4 (Q10–Q12)",
                    passage: SET_4_DIRECTIONS,
                    text: "How many persons sit between K and T when counted from the left of K?",
                    options: ["One", "Two", "Three", "Four", "Five"],
                    correct: 2,
                    explanation: "Final Arrangement (Clockwise): K – M – P – R – T – L – N – Q – S – V. Counting clockwise (left) from K to T, three persons (M, P, and R) sit between them."
                }
            ]
        };

        /* =========================================================
           3. ROMANTIC + MOTIVATIONAL QUOTES FROM PRITAM
           ========================================================= */
        const motivationalQuotes = [
            "No matter how complex the seating arrangement gets, my place in your life is permanently fixed right beside you—cheering you on to become a Bank Manager, Mallika!",
            "You solve every puzzle with such calm brilliance, my love. That Banking PO badge is already waiting for your name—keep going, I believe in you endlessly!",
            "Clockwise or anti-clockwise, every path in my life leads straight to admiring your hard work and dedication. Keep shining, future Bank Manager!",
            "Even in a room full of ten people, my eyes will always search for you first. Keep conquering these mocks, Mallika—your dream job is closer every single day!",
            "Every puzzle you crack today brings us one step closer to celebrating your Banking PO selection together. Stay confident, sweetheart—you've got this!",
            "Your focus, grace, and determination make me fall in love with your spirit all over again. Never doubt yourself, Mallika—victory belongs to you!",
            "Whether you score 100% or learn a tricky new pattern today, I am endlessly proud of the future Bank Manager you are becoming. Keep smiling and keep pushing!",
            "Remember, Mallika: every minute you invest in your preparation today is building the beautiful future we dream of. Pritam is always in your corner!"
        ];

        /* =========================================================
           4. APPLICATION STATE & DOM REFERENCES
           ========================================================= */
        let currentState = {
            mode: 'quiz', // 'quiz' | 'result' | 'review'
            currentIndex: 0,
            answers: {},
            score: 0,
            timeLeft: quizData.totalTimeSeconds,
            timerId: null,
            timeTaken: 0,
            wasAutoSubmitted: false,
            currentMotivation: "",
            lastQuoteIndex: -1
        };

        const container = document.getElementById('app-container');
        const footer = document.getElementById('footer-nav');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const btnBackResult = document.getElementById('btn-back-result');
        const animBox = document.getElementById('animation-container');
        const timerText = document.getElementById('timer-text');
        const timerBox = document.getElementById('timer-box');

        /* =========================================================
           5. INITIALIZATION & TIMER CONTROL
           ========================================================= */
        function initStaticIcons() {
            document.getElementById('header-bank-icon').innerHTML = getSvgIcon('building', 22);
            document.getElementById('header-clock-icon').innerHTML = getSvgIcon('clock', 16);
            document.getElementById('icon-prev').innerHTML = getSvgIcon('arrowLeft', 16);
            document.getElementById('icon-next').innerHTML = getSvgIcon('arrowRight', 16);
        }

        function init() {
            initStaticIcons();
            startTimer();
            render();
        }

        function resetQuiz() {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
            }
            const prevQuoteIdx = currentState.lastQuoteIndex;
            currentState = {
                mode: 'quiz',
                currentIndex: 0,
                answers: {},
                score: 0,
                timeLeft: quizData.totalTimeSeconds,
                timerId: null,
                timeTaken: 0,
                wasAutoSubmitted: false,
                currentMotivation: "",
                lastQuoteIndex: prevQuoteIdx
            };
            stopRewardAnimation();
            startTimer();
            render();
        }

        function startTimer() {
            updateTimerDisplay();
            currentState.timerId = setInterval(() => {
                currentState.timeLeft--;
                currentState.timeTaken++;
                updateTimerDisplay();
                if (currentState.timeLeft <= 0) {
                    calculateScore(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const safeTime = Math.max(0, currentState.timeLeft);
            const minutes = Math.floor(safeTime / 60);
            const seconds = safeTime % 60;
            timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (safeTime <= 60 && currentState.mode === 'quiz') {
                timerBox.classList.add('timer-danger');
            } else {
                timerBox.classList.remove('timer-danger');
            }
        }

        /* =========================================================
           6. QUIZ NAVIGATION & SCORING LOGIC
           ========================================================= */
        function selectAnswer(qIndex, optIndex) {
            if (currentState.mode !== 'quiz') return;
            currentState.answers[qIndex] = optIndex;
            render();
        }

        function jumpToQuestion(index) {
            if (index >= 0 && index < quizData.questions.length) {
                currentState.currentIndex = index;
                render();
            }
        }

        function nextQuestion() {
            if (currentState.currentIndex < quizData.questions.length - 1) {
                currentState.currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentState.currentIndex > 0) {
                currentState.currentIndex--;
                render();
            }
        }

        function pickDifferentQuote() {
            let idx = Math.floor(Math.random() * motivationalQuotes.length);
            if (motivationalQuotes.length > 1 && idx === currentState.lastQuoteIndex) {
                idx = (idx + 1) % motivationalQuotes.length;
            }
            currentState.lastQuoteIndex = idx;
            return motivationalQuotes[idx];
        }

        function calculateScore(autoSubmit = false) {
            if (currentState.timerId) {
                clearInterval(currentState.timerId);
                currentState.timerId = null;
            }

            let totalScore = 0;
            quizData.questions.forEach((q, idx) => {
                if (currentState.answers[idx] === q.correct) {
                    totalScore += quizData.marksPerQuestion;
                }
            });

            currentState.score = totalScore;
            currentState.mode = 'result';
            currentState.wasAutoSubmitted = autoSubmit;
            currentState.currentMotivation = pickDifferentQuote();

            updateTimerDisplay();
            render();
        }

        function startReview() {
            currentState.mode = 'review';
            currentState.currentIndex = 0;
            render();
        }

        function showResult() {
            currentState.mode = 'result';
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        /* =========================================================
           7. VIEW RENDERING
           ========================================================= */
        function render() {
            container.innerHTML = '';
            stopRewardAnimation();

            if (currentState.mode === 'quiz' || currentState.mode === 'review') {
                footer.classList.remove('hidden');
                renderQuestionView();
            } else {
                footer.classList.add('hidden');
                renderResultView();
            }
        }

        function renderQuestionView() {
            const q = quizData.questions[currentState.currentIndex];
            const isReview = currentState.mode === 'review';
            const totalQ = quizData.questions.length;
            const progress = ((currentState.currentIndex + 1) / totalQ) * 100;
            const selectedAnswer = currentState.answers[currentState.currentIndex];

            // Build Question Jump Palette
            let paletteHtml = '';
            quizData.questions.forEach((item, idx) => {
                const isCurrent = idx === currentState.currentIndex;
                const ans = currentState.answers[idx];
                let cls = 'palette-btn';

                if (isReview) {
                    if (ans === item.correct) cls += ' palette-correct';
                    else if (ans !== undefined) cls += ' palette-wrong';
                } else if (ans !== undefined) {
                    cls += ' palette-answered';
                }

                if (isCurrent) cls += ' palette-current';

                paletteHtml += `<button onclick="jumpToQuestion(${idx})" class="${cls}">${idx + 1}</button>`;
            });

            const headerHtml = `
                <div class="card header-card">
                    <div class="header-card-top">
                        <div class="quiz-meta">
                            <span class="quiz-title">${quizData.title}</span>
                            <span class="badge badge-blue">${q.setLabel}</span>
                            ${isReview ? '<span class="badge badge-amber">SOLUTIONS</span>' : ''}
                        </div>
                        <div style="display:flex; align-items:center; gap:0.65rem;">
                            <span class="q-counter">Question ${currentState.currentIndex + 1} of ${totalQ}</span>
                            ${!isReview ? '<button onclick="calculateScore(false)" class="quick-submit-btn">Submit</button>' : ''}
                        </div>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="palette-grid">${paletteHtml}</div>
                </div>
            `;

            // Build Option Buttons
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isSelected = selectedAnswer === idx;
                const isCorrect = q.correct === idx;
                let btnCls = 'option-btn';
                let statusIcon = '';

                if (isReview) {
                    if (isCorrect) {
                        btnCls += ' option-correct';
                        statusIcon = `<span style="color: var(--emerald-600); display:flex;">${getSvgIcon('checkCircle', 20)}</span>`;
                    } else if (isSelected && !isCorrect) {
                        btnCls += ' option-wrong';
                        statusIcon = `<span style="color: var(--rose-500); display:flex;">${getSvgIcon('xCircle', 20)}</span>`;
                    } else {
                        btnCls += ' option-dimmed';
                    }
                } else if (isSelected) {
                    btnCls += ' option-selected';
                }

                optionsHtml += `
                    <button onclick="selectAnswer(${currentState.currentIndex}, ${idx})" ${isReview ? 'disabled' : ''} class="${btnCls}">
                        <div class="option-left">
                            <span class="option-badge">${String.fromCharCode(65 + idx)}</span>
                            <span class="option-label">${opt}</span>
                        </div>
                        ${statusIcon}
                    </button>
                `;
            });

            // Passage / Directions Box
            const passageHtml = q.passage ? `
                <div class="passage-box">
                    <div class="passage-header">Directions (${q.setLabel})</div>
                    <div>${q.passage}</div>
                </div>
            ` : '';

            // Explanation in Review Mode
            const explanationHtml = (isReview && q.explanation) ? `
                <div class="explanation-box">
                    <div class="explanation-header">
                        ${getSvgIcon('lightbulb', 17)}
                        <span>Seating Arrangement &amp; Solution</span>
                    </div>
                    <p>${q.explanation}</p>
                </div>
            ` : '';

            container.innerHTML = `
                ${headerHtml}
                <div class="card question-card">
                    ${passageHtml}
                    <h2 class="question-text">Q${currentState.currentIndex + 1}. ${q.text}</h2>
                    <div>${optionsHtml}</div>
                    ${explanationHtml}
                </div>
            `;

            // Update Footer Buttons
            btnPrev.disabled = currentState.currentIndex === 0;
            btnNext.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            btnBackResult.classList.add('hidden');

            if (currentState.currentIndex < totalQ - 1) {
                btnNext.classList.remove('hidden');
            } else if (isReview) {
                btnBackResult.classList.remove('hidden');
            } else {
                btnSubmit.classList.remove('hidden');
            }
        }

        function renderResultView() {
            const totalQuestions = quizData.questions.length;
            const maxMarks = totalQuestions * quizData.marksPerQuestion;
            const attemptedCount = Object.keys(currentState.answers).length;
            const correctCount = currentState.score / quizData.marksPerQuestion;
            const wrongCount = attemptedCount - correctCount;
            const skippedCount = totalQuestions - attemptedCount;
            const percentage = Math.round((currentState.score / maxMarks) * 100);
            const accuracy = attemptedCount > 0 ? Math.round((correctCount / attemptedCount) * 100) : 0;
            const speedPerQ = attemptedCount > 0 ? Math.round(currentState.timeTaken / attemptedCount) : 0;

            let grade, animationType;
            if (percentage >= 80) {
                grade = { title: "Future Bank Manager!", colorClass: "text-amber", iconName: "crown" };
                animationType = 'coins';
            } else if (percentage >= 60) {
                grade = { title: "Probationary Officer (PO)", colorClass: "text-blue", iconName: "zap" };
                animationType = 'confetti';
            } else {
                grade = { title: "Banking Aspirant", colorClass: "text-slate", iconName: "bookOpen" };
                animationType = 'balloons';
            }

            startRewardAnimation(animationType);

            const circleCircumference = 2 * Math.PI * 15.9155;
            const accuracyDash = (accuracy / 100) * circleCircumference;

            container.innerHTML = `
                <div class="result-stack">
                    <!-- Scorecard & Pritam's Note -->
                    <div class="card scorecard">
                        <div class="score-banner ${percentage >= 80 ? 'banner-gold' : 'banner-blue'}">
                            <div class="grade-icon-wrap">
                                ${getSvgIcon(grade.iconName, 34)}
                            </div>
                            <p class="score-kicker">Scorecard for Mallika Naiya</p>
                            <h2 class="score-big">${currentState.score} <span>/ ${maxMarks}</span></h2>
                            <p class="score-sub">Total Marks Obtained (${percentage}%)</p>
                        </div>

                        <div class="grade-strip">
                            ${currentState.wasAutoSubmitted ? '<div style="margin-bottom:0.4rem;"><span class="badge badge-rose">Time Up — Auto Submitted</span></div>' : ''}
                            <h3 class="grade-title ${grade.colorClass}">${grade.title}</h3>
                        </div>

                        <!-- Special Note from Pritam -->
                        <div class="pritam-note-section">
                            <div class="pritam-top-bar"></div>
                            <span class="pritam-badge">
                                ${getSvgIcon('heart', 14)}
                                <span>A Special Note for You from Pritam</span>
                            </span>
                            <p class="pritam-quote">"${currentState.currentMotivation}"</p>
                        </div>
                    </div>

                    <!-- 4-Card Metrics Grid -->
                    <div class="metrics-grid">
                        <div class="card metric-card">
                            <div class="gauge-wrap">
                                <svg viewBox="0 0 36 36" class="circular-chart">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" stroke-dasharray="${accuracyDash}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div class="gauge-text">${accuracy}%</div>
                            </div>
                            <span class="metric-label">Accuracy</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-purple">${getSvgIcon('clock', 20)}</div>
                            <span class="metric-val">${formatTime(currentState.timeTaken)}</span>
                            <span class="metric-label">Time Taken</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-amber">${getSvgIcon('edit', 20)}</div>
                            <span class="metric-val">${attemptedCount} <small>/ ${totalQuestions}</small></span>
                            <span class="metric-label">Attempted</span>
                        </div>

                        <div class="card metric-card">
                            <div class="metric-icon icon-emerald">${getSvgIcon('zap', 20)}</div>
                            <span class="metric-val">${speedPerQ}s</span>
                            <span class="metric-label">Avg Speed / Q</span>
                        </div>
                    </div>

                    <!-- Detailed Breakdown -->
                    <div class="card breakdown-card">
                        <h4 class="breakdown-title">
                            <span class="breakdown-icon">${getSvgIcon('barChart', 18)}</span>
                            <span>Detailed Performance Breakdown</span>
                        </h4>

                        <div class="stacked-bar">
                            <div class="bar-correct" style="width: ${(correctCount / totalQuestions) * 100}%"></div>
                            <div class="bar-wrong" style="width: ${(wrongCount / totalQuestions) * 100}%"></div>
                            <div class="bar-skipped" style="width: ${(skippedCount / totalQuestions) * 100}%"></div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box stat-correct">
                                <span class="stat-num">${correctCount}</span>
                                <span class="stat-lbl">Correct</span>
                            </div>
                            <div class="stat-box stat-wrong">
                                <span class="stat-num">${wrongCount}</span>
                                <span class="stat-lbl">Incorrect</span>
                            </div>
                            <div class="stat-box stat-skipped">
                                <span class="stat-num">${skippedCount}</span>
                                <span class="stat-lbl">Skipped</span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-grid">
                        <button onclick="startReview()" class="btn btn-outline-blue">
                            ${getSvgIcon('eye', 18)}
                            <span>Review Rules &amp; Solutions</span>
                        </button>

                        <button onclick="resetQuiz()" class="btn btn-solid-dark">
                            ${getSvgIcon('rotateCcw', 18)}
                            <span>Retake Mock Test</span>
                        </button>
                    </div>
                </div>
            `;
        }

        /* =========================================================
           8. CELEBRATION PARTICLES
           ========================================================= */
        let animationInterval = null;

        function startRewardAnimation(type) {
            animBox.classList.remove('hidden');
            if (animationInterval) clearInterval(animationInterval);

            for (let i = 0; i < 18; i++) {
                createParticle(type);
            }

            const intervalTime = type === 'coins' ? 220 : 320;
            animationInterval = setInterval(() => {
                createParticle(type);
            }, intervalTime);
        }

        function stopRewardAnimation() {
            animBox.classList.add('hidden');
            animBox.innerHTML = '';
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
        }

        function createParticle(type) {
            const el = document.createElement('div');
            el.classList.add('particle');
            const randomX = Math.random() * 96;

            if (type === 'coins') {
                el.classList.add('coin');
                el.textContent = '₹';
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = '34px';
                el.style.height = '34px';
                el.style.fontSize = '20px';
                el.style.animationDuration = (Math.random() * 1.5 + 1.8) + 's';
            } else if (type === 'confetti') {
                el.classList.add('confetti');
                el.style.left = randomX + '%';
                el.style.top = '-8vh';
                el.style.width = (Math.random() * 10 + 6) + 'px';
                el.style.height = (Math.random() * 10 + 6) + 'px';
                el.style.backgroundColor = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6'][Math.floor(Math.random() * 5)];
                el.style.animationDuration = (Math.random() * 2.5 + 2.2) + 's';
            } else {
                el.classList.add('balloon');
                el.style.left = randomX + '%';
                el.style.top = '105vh';
                el.style.width = '32px';
                el.style.height = '42px';
                el.style.backgroundColor = ['#FCA5A5', '#93C5FD', '#6EE7B7', '#FDE047'][Math.floor(Math.random() * 4)];
                el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            }

            animBox.appendChild(el);
            setTimeout(() => {
                if (el.parentNode) el.remove();
            }, 7500);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
