<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Mastery Mock Test</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Modern gradient background */
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(217,100%,92%,1) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, hsla(240,100%,94%,1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(210,100%,90%,1) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
        
        /* --- Animation Keyframes --- */
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        @keyframes rise {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-120vh) translateX(20px) rotate(10deg); opacity: 0; }
        }

        /* --- Particle Classes --- */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 60;
        }

        .confetti { animation-name: fall; animation-timing-function: linear; }

        .coin {
            animation-name: fall;
            animation-timing-function: ease-in;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #78350f;
            border: 2px solid #b45309;
            background: radial-gradient(circle at 30% 30%, #fcd34d, #f59e0b);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .balloon {
            animation-name: rise;
            animation-timing-function: ease-out;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }
        
        /* Circular Progress Chart */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 80%;
            max-height: 250px;
        }
        .circle-bg {
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 3.8;
        }
        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            animation: progress 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes progress {
            0% { stroke-dasharray: 0 100; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 relative">

    <!-- Global Header with Timer (Glassmorphism) -->
    <div class="glass sticky top-0 z-40 px-4 py-3 md:px-8 flex justify-between items-center transition-all">
        <div class="flex items-center gap-3 cursor-pointer group" onclick="resetQuiz()">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-500/30 group-hover:scale-105 transition-transform">
                <i data-lucide="building-2" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-sm md:text-lg font-extrabold text-slate-800 tracking-tight leading-tight">Banking Mock Test</h1>
                <p class="text-xs font-semibold text-blue-600">Candidate: Mallika Naiya</p>
            </div>
        </div>
        
        <!-- Timer Display -->
        <div id="timer-box" class="flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-full shadow-lg border border-slate-700 transition-colors duration-300">
            <i data-lucide="timer" class="w-4 h-4 text-emerald-400" id="timer-icon"></i>
            <span id="timer-text" class="font-mono font-bold text-lg tracking-wider">30:00</span>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="app-container" class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 pb-32">
        <!-- Dynamic Content will be injected here -->
    </div>

    <!-- Footer Navigation (Glassmorphism) -->
    <div id="footer-nav" class="fixed bottom-0 left-0 w-full glass border-t-0 border-white p-4 z-30 hidden shadow-[0_-10px_40px_-10px_rgba(0,0,0,0.1)]">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <button id="btn-prev" onclick="prevQuestion()" class="text-slate-600 font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-100/80 hover:text-slate-900 transition-all active:scale-95 disabled:opacity-30 disabled:pointer-events-none">
                <div class="flex items-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i> Previous</div>
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-600/25 transition-all active:scale-95 flex items-center gap-2 hidden">
                Next <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
            <button id="btn-submit" onclick="calculateScore()" class="bg-emerald-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-600 hover:shadow-lg hover:shadow-emerald-500/30 transition-all active:scale-95 hidden">
                Submit Test
            </button>
            <button id="btn-back-result" onclick="showResult()" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-900 hover:shadow-lg hover:shadow-slate-800/30 transition-all active:scale-95 hidden">
                View Report
            </button>
        </div>
    </div>

    <!-- Animation Container -->
    <div id="animation-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden hidden"></div>

    <script>
        // --- DATA SECTION: 20 MULTIPLICATION QUESTIONS ---
        const quizData = {
            title: "Multiplication Mastery",
            totalTimeSeconds: 30 * 60, // 30 Minutes
            questions: [
                { id: 1, text: "[3-Digit by 2-Digit Multiplication] 426 × 35 = ?", options: ["14810", "15910", "14910", "14900"], correct: 2 }, // c
                { id: 2, text: "[3-Digit by 2-Digit Multiplication] 514 × 42 = ?", options: ["21588", "21488", "22588", "21688"], correct: 0 }, // a
                { id: 3, text: "[3-Digit by 2-Digit Multiplication] 732 × 26 = ?", options: ["18032", "19032", "19132", "19022"], correct: 1 }, // b
                { id: 4, text: "[Multiplication by Halving - × 5] 428 × 5 = ?", options: ["2040", "2240", "2150", "2140"], correct: 3 }, // d
                { id: 5, text: "[Multiplication by Halving - × 5] 3642 × 5 = ?", options: ["18210", "17210", "18310", "18110"], correct: 0 }, // a
                { id: 6, text: "[Multiplication by Halving - × 5] 824 × 5 = ?", options: ["4120", "4020", "4220", "4130"], correct: 0 }, // a
                { id: 7, text: "[Base 100 Multiplication] 105 × 106 = ?", options: ["11030", "11130", "11230", "11120"], correct: 1 }, // b
                { id: 8, text: "[Base 100 Multiplication] 104 × 108 = ?", options: ["11132", "11332", "11232", "11242"], correct: 2 }, // c
                { id: 9, text: "[Base 100 Multiplication] 107 × 103 = ?", options: ["10921", "11121", "11031", "11021"], correct: 3 }, // d
                { id: 10, text: "[2-Digit by 2-Digit Multiplication] 43 × 28 = ?", options: ["1204", "1104", "1304", "1214"], correct: 0 }, // a
                { id: 11, text: "[2-Digit by 2-Digit Multiplication] 67 × 54 = ?", options: ["3518", "3618", "3718", "3628"], correct: 1 }, // b
                { id: 12, text: "[2-Digit by 2-Digit Multiplication] 82 × 39 = ?", options: ["3098", "3298", "3198", "3188"], correct: 2 }, // c
                { id: 13, text: "[3-Digit by 3-Digit Multiplication] 215 × 134 = ?", options: ["28810", "27810", "29810", "28710"], correct: 0 }, // a
                { id: 14, text: "[3-Digit by 3-Digit Multiplication] 432 × 251 = ?", options: ["107432", "109432", "108332", "108432"], correct: 3 }, // d
                { id: 15, text: "[3-Digit by 3-Digit Multiplication] 345 × 312 = ?", options: ["107640", "106640", "108640", "107540"], correct: 0 }, // a
                { id: 16, text: "[3-Digit by 3-Digit Multiplication] 512 × 423 = ?", options: ["215576", "216576", "217576", "216476"], correct: 1 }, // b
                { id: 17, text: "[Multiply with 11] 435 × 11 = ?", options: ["4685", "4885", "4785", "4775"], correct: 2 }, // c
                { id: 18, text: "[Multiply with 11] 3274 × 11 = ?", options: ["36014", "35014", "37014", "36114"], correct: 0 }, // a
                { id: 19, text: "[Multiply with 11] 52416 × 11 = ?", options: ["566576", "576576", "586576", "575576"], correct: 1 }, // b
                { id: 20, text: "[Multiply with 11] 8421 × 11 = ?", options: ["92631", "91631", "92731", "91731"], correct: 0 }  // a (Added to complete set of 20)
            ]
        };

        // --- MOTIVATIONAL QUOTES POOL ---
        const motivationalQuotes = [
            "Believe in yourself, Mallika! That Bank Manager's cabin is waiting for you.",
            "Success doesn't come from what you do occasionally, it comes from what you do consistently.",
            "Your dream of becoming a Banking PO is valid and reachable. Keep pushing!",
            "Mistakes are proof that you are trying. Analyze, learn, and conquer the next test!",
            "The distance between your dreams and reality is called action. You are taking action!",
            "Don't stop until you're proud. The banking world needs your leadership.",
            "Every mock test is a step closer to your final selection. Keep the momentum going!",
            "You are capable of more than you know. Trust your preparation, Mallika!",
            "Focus on the process, and the results will follow. You are building a strong foundation.",
            "Difficult roads often lead to beautiful destinations. Your journey to Manager starts here."
        ];

        // --- STREAMING_CHUNK:Defining core logic and state... ---
        let currentState = {
            mode: 'quiz',
            currentIndex: 0,
            answers: {}, 
            score: 0,
            timeLeft: quizData.totalTimeSeconds,
            timerId: null,
            timeTaken: 0,
            currentMotivation: "" 
        };

        // --- DOM ELEMENTS ---
        const container = document.getElementById('app-container');
        const footer = document.getElementById('footer-nav');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');
        const btnBackResult = document.getElementById('btn-back-result');
        const animBox = document.getElementById('animation-container');
        const timerText = document.getElementById('timer-text');
        const timerBox = document.getElementById('timer-box');
        const timerIcon = document.getElementById('timer-icon');

        // --- INITIALIZATION ---
        function init() {
            lucide.createIcons();
            startTimer();
            render();
        }

        function resetQuiz() {
            clearInterval(currentState.timerId);
            currentState = {
                mode: 'quiz',
                currentIndex: 0,
                answers: {},
                score: 0,
                timeLeft: quizData.totalTimeSeconds,
                timerId: null,
                timeTaken: 0,
                currentMotivation: ""
            };
            stopRewardAnimation();
            startTimer();
            
            // Reset timer UI
            timerBox.classList.remove('bg-red-600', 'animate-pulse');
            timerBox.classList.add('bg-slate-900');
            timerIcon.classList.replace('text-yellow-400', 'text-emerald-400');
            
            render();
        }

        // --- STREAMING_CHUNK:Timer and score management... ---
        function startTimer() {
            updateTimerDisplay();
            currentState.timerId = setInterval(() => {
                currentState.timeLeft--;
                currentState.timeTaken++;
                updateTimerDisplay();
                if (currentState.timeLeft <= 0) {
                    calculateScore(true);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(currentState.timeLeft / 60);
            const seconds = currentState.timeLeft % 60;
            timerText.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (currentState.timeLeft < 60) {
                timerBox.classList.replace('bg-slate-900', 'bg-red-600');
                timerIcon.classList.replace('text-emerald-400', 'text-yellow-400');
                timerBox.classList.add('animate-pulse');
            }
        }

        function selectAnswer(qIndex, optIndex) {
            if (currentState.mode === 'review') return;
            currentState.answers[qIndex] = optIndex;
            render(); 
        }

        function nextQuestion() {
            if (currentState.currentIndex < quizData.questions.length - 1) {
                currentState.currentIndex++;
                render();
            }
        }

        function prevQuestion() {
            if (currentState.currentIndex > 0) {
                currentState.currentIndex--;
                render();
            }
        }

        function calculateScore(autoSubmit = false) {
            clearInterval(currentState.timerId);
            let s = 0;
            quizData.questions.forEach((q, idx) => {
                if (currentState.answers[idx] === q.correct) s += 2; // 2 Marks each
            });
            currentState.score = s;
            currentState.mode = 'result';
            
            const randomIndex = Math.floor(Math.random() * motivationalQuotes.length);
            currentState.currentMotivation = motivationalQuotes[randomIndex];
            
            if(autoSubmit) alert("Time's up! Your test has been automatically submitted.");
            
            render();
        }

        function startReview() {
            currentState.mode = 'review';
            currentState.currentIndex = 0;
            render();
        }

        function showResult() {
            currentState.mode = 'result';
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}m ${s}s`;
        }

        // --- STREAMING_CHUNK:Rendering View Templates... ---
        function render() {
            container.innerHTML = '';
            footer.classList.remove('hidden');
            stopRewardAnimation();

            if (currentState.mode === 'quiz' || currentState.mode === 'review') {
                renderQuestionView();
            } else if (currentState.mode === 'result') {
                renderResultView();
            }
            
            lucide.createIcons();
        }

        function renderQuestionView() {
            const q = quizData.questions[currentState.currentIndex];
            const isReview = currentState.mode === 'review';
            const progress = ((currentState.currentIndex + 1) / quizData.questions.length) * 100;
            const selectedAnswer = currentState.answers[currentState.currentIndex];
            const isAnswered = selectedAnswer !== undefined;

            const headerHtml = `
                <div class="glass-card rounded-2xl p-5 mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-100 text-blue-700 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg">
                                ${currentState.currentIndex + 1}
                            </div>
                            <span class="font-bold text-slate-700 text-lg">${isReview ? 'Review Mode' : quizData.title}</span>
                            ${isReview ? '<span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-bold shadow-sm border border-amber-200">SOLUTION</span>' : ''}
                        </div>
                        <div class="text-sm font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">
                            ${currentState.currentIndex + 1} / ${quizData.questions.length}
                        </div>
                    </div>
                    <div class="h-2 bg-slate-100 w-full rounded-full overflow-hidden shadow-inner">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                    </div>
                </div>
            `;

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const isSelected = selectedAnswer === idx;
                const isCorrect = q.correct === idx;
                
                let btnClass = "border-slate-200 hover:border-blue-300 hover:bg-blue-50/50 hover:-translate-y-1 hover:shadow-md";
                let badgeClass = "bg-slate-100 text-slate-500 group-hover:bg-blue-100 group-hover:text-blue-600";
                let icon = '';
                let textClass = "text-slate-700";

                if (isReview) {
                    if (isCorrect) {
                        btnClass = "bg-emerald-50 border-emerald-500 ring-1 ring-emerald-500 shadow-sm";
                        badgeClass = "bg-emerald-500 text-white shadow-md shadow-emerald-500/30";
                        textClass = "text-emerald-900 font-bold";
                        icon = '<i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-500"></i>';
                    } else if (isSelected && !isCorrect) {
                        btnClass = "bg-rose-50 border-rose-400";
                        badgeClass = "bg-rose-100 text-rose-600";
                        textClass = "text-rose-800 font-medium";
                        icon = '<i data-lucide="x-circle" class="w-6 h-6 text-rose-400"></i>';
                    } else {
                        btnClass = "border-slate-100 opacity-50 bg-slate-50";
                    }
                } else {
                    if (isSelected) {
                        btnClass = "border-blue-500 bg-blue-50 ring-2 ring-blue-500/20 shadow-md translate-y-0";
                        badgeClass = "bg-blue-600 text-white shadow-md shadow-blue-500/30";
                        textClass = "text-blue-900 font-bold";
                    }
                }

                optionsHtml += `
                    <button 
                        onclick="selectAnswer(${currentState.currentIndex}, ${idx})"
                        ${isReview ? 'disabled' : ''}
                        class="w-full text-left p-4 md:p-5 rounded-2xl border-2 transition-all duration-200 flex items-center justify-between group mb-4 ${btnClass}"
                    >
                        <div class="flex items-center gap-4">
                            <span class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-colors ${badgeClass}">
                                ${String.fromCharCode(65 + idx)}
                            </span>
                            <span class="text-lg md:text-xl ${textClass}">${opt}</span>
                        </div>
                        ${icon}
                    </button>
                `;
            });

            container.innerHTML = `
                ${headerHtml}
                <div class="glass-card rounded-3xl p-6 md:p-10 transform transition-all">
                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed mb-8 tracking-tight">${q.text}</h3>
                    <div class="space-y-2">${optionsHtml}</div>
                </div>
            `;

            btnPrev.disabled = currentState.currentIndex === 0;
            btnNext.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            btnBackResult.classList.add('hidden');

            if (currentState.currentIndex < quizData.questions.length - 1) {
                btnNext.classList.remove('hidden');
            } else {
                if (isReview) {
                    btnBackResult.classList.remove('hidden');
                } else {
                    btnSubmit.classList.remove('hidden');
                }
            }
        }

        // --- STREAMING_CHUNK:Rendering Performance Dashboard... ---
        function renderResultView() {
            footer.classList.add('hidden'); 
            
            const totalQuestions = quizData.questions.length;
            const maxMarks = totalQuestions * 2;
            const attemptedCount = Object.keys(currentState.answers).length;
            const correctCount = currentState.score / 2;
            const wrongCount = attemptedCount - correctCount;
            const skippedCount = totalQuestions - attemptedCount;
            const percentage = (currentState.score / maxMarks) * 100;
            const accuracy = attemptedCount > 0 ? Math.round((correctCount / attemptedCount) * 100) : 0;
            const speedPerQ = attemptedCount > 0 ? Math.round(currentState.timeTaken / attemptedCount) : 0;

            let grade, animationType;
            if (percentage >= 80) {
                grade = { 
                    title: "Future Bank Manager!", 
                    color: "text-amber-500", 
                    gradient: "from-amber-400 via-orange-500 to-amber-600",
                    icon: "award",
                    border: "border-amber-200"
                };
                animationType = 'coins';
            } else if (percentage >= 60) {
                grade = { 
                    title: "Probationary Officer (PO)", 
                    color: "text-blue-500", 
                    gradient: "from-blue-500 via-indigo-500 to-purple-600",
                    icon: "zap",
                    border: "border-blue-200"
                };
                animationType = 'confetti';
            } else {
                grade = { 
                    title: "Banking Aspirant", 
                    color: "text-slate-600", 
                    gradient: "from-slate-500 to-slate-700",
                    icon: "book-open",
                    border: "border-slate-200"
                };
                animationType = 'balloons';
            }

            startRewardAnimation(animationType);

            const circleCircumference = 2 * Math.PI * 15.9155;
            const accuracyDash = (accuracy / 100) * circleCircumference;

            container.innerHTML = `
                <div class="flex flex-col gap-8 animate-fade-in pb-10">
                    
                    <!-- 1. Hero Score Card (Glassmorphism) -->
                    <div class="glass-card rounded-[2.5rem] overflow-hidden relative ${grade.border} border-2">
                         <div class="p-10 bg-gradient-to-br ${grade.gradient} text-white text-center relative overflow-hidden">
                            <!-- Background Design Elements -->
                            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-white opacity-10 rounded-full blur-2xl"></div>
                            <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-32 h-32 bg-black opacity-10 rounded-full blur-xl"></div>
                            
                            <div class="relative z-10">
                                <div class="bg-white/20 w-20 h-20 mx-auto rounded-2xl flex items-center justify-center backdrop-blur-sm mb-4 shadow-lg border border-white/30">
                                    <i data-lucide="${grade.icon}" class="w-10 h-10 text-white"></i>
                                </div>
                                <h2 class="text-6xl font-black tracking-tight mb-2 drop-shadow-md">
                                    ${currentState.score} <span class="text-2xl font-semibold opacity-80 mix-blend-overlay">/ ${maxMarks}</span>
                                </h2>
                                <p class="text-sm font-bold opacity-90 tracking-widest uppercase">Total Marks Achieved</p>
                            </div>
                        </div>
                        <div class="p-6 text-center bg-white/60">
                            <h3 class="text-2xl font-extrabold ${grade.color} drop-shadow-sm">${grade.title}</h3>
                        </div>
                        
                        <!-- Custom Pritam Note -->
                        <div class="p-8 bg-slate-50/80 text-center relative overflow-hidden group border-t border-slate-200/60">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-500"></div>
                            
                            <div class="inline-block px-4 py-1.5 bg-indigo-100 text-indigo-700 text-xs font-black uppercase tracking-widest rounded-full mb-4 shadow-sm border border-indigo-200">
                                A Special Note for You from Pritam
                            </div>
                            
                            <div class="relative max-w-2xl mx-auto">
                                <i data-lucide="quote" class="w-8 h-8 text-indigo-200 absolute -top-2 -left-4 opacity-60"></i>
                                <p class="text-slate-700 font-serif italic text-lg md:text-xl leading-relaxed px-6 font-medium">
                                    ${currentState.currentMotivation}
                                </p>
                                <i data-lucide="quote" class="w-8 h-8 text-indigo-200 absolute -bottom-4 -right-4 opacity-60 rotate-180"></i>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Bento Grid Dashboard -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
                        <!-- Accuracy -->
                        <div class="glass-card p-6 rounded-3xl flex flex-col items-center hover:-translate-y-1 transition-transform">
                            <div class="relative w-20 h-20 mb-3">
                                <svg viewBox="0 0 36 36" class="circular-chart text-blue-500 drop-shadow-md">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="circle" stroke-dasharray="${accuracyDash}, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" stroke="currentColor"/>
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center text-sm font-black text-slate-700">${accuracy}%</div>
                            </div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Accuracy</span>
                        </div>

                        <!-- Time Taken -->
                        <div class="glass-card p-6 rounded-3xl flex flex-col items-center justify-center hover:-translate-y-1 transition-transform">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-100 to-fuchsia-100 text-purple-600 flex items-center justify-center mb-3 shadow-sm border border-purple-200">
                                <i data-lucide="clock" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${formatTime(currentState.timeTaken)}</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Time Taken</span>
                        </div>

                        <!-- Attempted -->
                        <div class="glass-card p-6 rounded-3xl flex flex-col items-center justify-center hover:-translate-y-1 transition-transform">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-orange-100 to-amber-100 text-orange-600 flex items-center justify-center mb-3 shadow-sm border border-orange-200">
                                <i data-lucide="edit-3" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${attemptedCount} <span class="text-sm text-slate-400 font-bold">/ ${totalQuestions}</span></span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Attempted</span>
                        </div>

                        <!-- Speed -->
                        <div class="glass-card p-6 rounded-3xl flex flex-col items-center justify-center hover:-translate-y-1 transition-transform">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-100 to-teal-100 text-emerald-600 flex items-center justify-center mb-3 shadow-sm border border-emerald-200">
                                <i data-lucide="zap" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xl font-black text-slate-800">${speedPerQ}s</span>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Avg Speed</span>
                        </div>
                    </div>

                    <!-- 3. Detailed Stats Breakdown -->
                    <div class="glass-card rounded-3xl p-8">
                        <h4 class="font-extrabold text-slate-800 mb-6 flex items-center gap-3 text-lg">
                            <div class="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="bar-chart-2" class="w-5 h-5"></i></div>
                            Question Breakdown
                        </h4>
                        
                        <div class="flex h-6 rounded-xl overflow-hidden mb-8 bg-slate-100 shadow-inner">
                            <div style="width: ${(correctCount/totalQuestions)*100}%" class="bg-gradient-to-r from-emerald-400 to-emerald-500 relative group">
                                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <div style="width: ${(wrongCount/totalQuestions)*100}%" class="bg-gradient-to-r from-rose-400 to-rose-500 relative group">
                                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                            <div style="width: ${(skippedCount/totalQuestions)*100}%" class="bg-slate-300 relative group">
                                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div class="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100">
                                <span class="block text-3xl font-black text-emerald-600 drop-shadow-sm">${correctCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Correct</span>
                            </div>
                            <div class="bg-rose-50/50 p-4 rounded-2xl border border-rose-100">
                                <span class="block text-3xl font-black text-rose-600 drop-shadow-sm">${wrongCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Incorrect</span>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                                <span class="block text-3xl font-black text-slate-500 drop-shadow-sm">${skippedCount}</span>
                                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mt-1 block">Skipped</span>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <button onclick="startReview()" class="w-full bg-white text-indigo-600 border-2 border-indigo-100 py-4 rounded-2xl font-bold hover:bg-indigo-50 hover:border-indigo-200 hover:-translate-y-1 hover:shadow-lg transition-all flex items-center justify-center gap-2">
                            <i data-lucide="eye" class="w-5 h-5"></i> Review Solutions
                        </button>

                        <button onclick="resetQuiz()" class="w-full bg-slate-900 text-white border-2 border-slate-900 py-4 rounded-2xl font-bold hover:bg-slate-800 hover:-translate-y-1 hover:shadow-lg hover:shadow-slate-900/30 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Retake Test
                        </button>
                    </div>
                </div>
            `;
        }

        // --- STREAMING_CHUNK:Reward Animations... ---
        let animationInterval;
        
        function startRewardAnimation(type) {
            animBox.classList.remove('hidden');
            if (animationInterval) clearInterval(animationInterval);
            for(let i=0; i<20; i++) createParticle(type); // Initial burst
            let intervalTime = 300;
            if(type === 'coins') intervalTime = 200; 
            animationInterval = setInterval(() => { createParticle(type); }, intervalTime);
        }

        function stopRewardAnimation() {
            animBox.classList.add('hidden');
            animBox.innerHTML = '';
            if (animationInterval) clearInterval(animationInterval);
        }

        function createParticle(type) {
            const el = document.createElement('div');
            el.classList.add('particle');
            const randomX = Math.random() * 100;
            if (type === 'coins') {
                el.classList.add('coin');
                el.textContent = '₹';
                el.style.left = randomX + '%';
                el.style.top = '-10vh'; 
                el.style.width = '36px';
                el.style.height = '36px';
                el.style.fontSize = '22px';
                el.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
            } else if (type === 'confetti') {
                el.classList.add('confetti');
                el.style.left = randomX + '%';
                el.style.top = '-10vh'; 
                el.style.width = (Math.random() * 12 + 6) + 'px';
                el.style.height = (Math.random() * 12 + 6) + 'px';
                el.style.backgroundColor = ['#10B981', '#3B82F6', '#F59E0B', '#EC4899', '#8B5CF6'][Math.floor(Math.random() * 5)];
                el.style.animationDuration = (Math.random() * 3 + 2) + 's';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
            } else {
                el.classList.add('balloon');
                el.style.left = randomX + '%';
                el.style.top = '110vh'; 
                el.style.width = '35px';
                el.style.height = '45px';
                el.style.backgroundColor = ['#FCA5A5', '#93C5FD', '#6EE7B7', '#FDE047'][Math.floor(Math.random() * 4)];
                el.style.animationDuration = (Math.random() * 3 + 4) + 's';
            }
            animBox.appendChild(el);
            setTimeout(() => { el.remove(); }, 8000);
        }

        // Run application
        init();
    </script>
</body>
</html>
